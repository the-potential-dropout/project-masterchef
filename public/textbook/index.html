<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masterchef, by The Potential Dropout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
</style><style>/*
VOICE: a friendly, patient textbook; calm and clear, never shouty.
IDEA: a pastel study notebook where every chapter has its own paper colour.
PICTURE: each page carries a live diagram of the idea, moving, hoverable, glowing.
COLOUR and TYPE: pastel chapter fields, near-black ink, one deeper accent per chapter; Lexend titles, Atkinson Hyperlegible body.
LAYOUT: sticky top bar, slide-out outline, page card with text left and diagram right; stacks on phones.
*/
:root{color-scheme:light;--ink:#1b2230;--ink2:#3d4658;--line:#1b223022;--paper:#fffdf8;--bg:#eef3f7;--acc:#2b74b8;--soft:#ffffffb3}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#f4f1ea;color:var(--ink);font:17px/1.6 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.brand b{font-family:Lexend,"Atkinson Hyperlegible",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1b2230;outline-offset:2px;border-radius:8px}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(2vw,10px);background:#fbf8f2ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;white-space:nowrap}
.brand b{font-size:26px;letter-spacing:.5px}
.brand span{font-size:14px;color:var(--ink2)}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:6px;transition:box-shadow .2s,transform .1s}
.btn:hover{box-shadow:0 0 0 4px #1b22300f,0 0 18px #ffd27a88}
.btn:active{transform:translateY(1px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{min-height:44px;border:0;background:none;padding:0 14px}
.seg button[aria-pressed=true]{background:#1b2230;color:#fff}
.search{position:relative}
.search input{min-height:44px;width:220px;border-radius:12px;border:1px solid var(--line);padding:0 12px;background:#fff;font-size:16px}
.results{position:absolute;top:48px;left:0;width:320px;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0002;display:none;z-index:60}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;min-height:44px}
.results button:hover,.results button.sel{background:#f2efe7}
.results small{display:block;color:var(--ink2);font-size:13px}
.bm{position:relative;display:inline-flex}
.bm .btn:first-child{border-radius:12px 0 0 12px}
.bm .btn:last-child{border-radius:0 12px 12px 0;border-left:0;padding:0 10px}
.menu{position:absolute;right:0;top:50px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0002;padding:6px;display:none;z-index:60;width:260px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;min-height:44px}
.menu button:hover{background:#f2efe7}
.menu p{margin:6px 12px;font-size:13px;color:var(--ink2)}
:root{--th:62px}
.wrap{display:flex;min-height:calc(100vh - var(--th))}
.outline{width:300px;flex:none;border-right:1px solid var(--line);background:#fbf8f2;height:calc(100vh - var(--th));position:sticky;top:var(--th);overflow:auto;padding:10px 8px 40px;transition:margin .25s}
.wrap.closed .outline{margin-left:-300px}
.outline h4{margin:6px 10px 8px;font:600 14px Lexend,sans-serif;color:var(--ink2)}
.ch>button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;display:flex;gap:8px;align-items:center;min-height:44px;font-weight:700;font-size:15px}
.ch>button i{width:12px;height:12px;border-radius:4px;flex:none;border:1px solid #0002}
.ch>button:hover{background:#efe9de}
.ch ol{list-style:none;margin:0 0 6px;padding:0 0 0 22px;display:none}
.ch.open ol{display:block}
.ch li button{width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px;font-size:15px;min-height:36px;display:flex;gap:8px}
.ch li button:hover{background:#efe9de}
.ch li button.cur{background:#1b2230;color:#fff}
.ch li button .v{width:8px;height:8px;border-radius:50%;margin-top:9px;flex:none;background:#0000;border:1.5px solid #1b223055}
.ch li button .v.seen{background:#1b2230aa;border-color:transparent}
.ch li button>span:nth-child(2){flex:1}
.ch li button .bmk{margin-left:auto;font-size:11px;padding:0 5px;flex:none;border-radius:6px;background:#ffd27a;color:#1b2230;align-self:center}
main{flex:1;position:relative}
.stage{padding:18px max(2vw,12px) 110px}
.slide{--bg:#dcedfb;--acc:#2b74b8;scroll-margin-top:76px}
.slides .slide{display:none}
.slides .slide.on{display:block;animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.slides .slide.on.back{animation-name:enterb}
@keyframes enter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes enterb{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.book .slide{margin:0 auto 26px}
.card{background:var(--bg);border-radius:26px;padding:clamp(18px,3vw,40px);max-width:1240px;margin:0 auto;box-shadow:0 1px 0 #fff inset,0 18px 50px -24px #1b223055;position:relative;overflow:clip}
.slides .card{min-height:calc(100vh - 210px)}
.card::before{content:"";position:absolute;inset:auto -80px -120px auto;width:320px;height:320px;border-radius:50%;background:radial-gradient(#ffffff88,transparent 70%);pointer-events:none}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-bottom:6px}
.meta b{color:var(--ink)}
h2{font-size:clamp(28px,3.6vw,46px);line-height:1.08;margin:4px 0 16px;text-wrap:balance}
h3{font-size:20px;margin:16px 0 6px}
.cols{display:grid;gap:clamp(16px,2.5vw,36px);align-items:start}
.has-viz .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.body{max-width:72ch}
.body ul,.body ol{padding-left:1.2em;margin:.4em 0}
.body li{margin:.25em 0}
.body p{margin:.5em 0}
.call{font:600 21px/1.35 Lexend,sans-serif;background:var(--soft);border-radius:14px;padding:12px 16px}
.tw{overflow-x:auto;margin:10px 0;border-radius:14px;background:#ffffffa6}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:#ffffff80}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}
tbody tr:hover{background:#fff}
.term{border-bottom:2px dotted var(--acc);cursor:pointer;border-radius:4px;transition:background .2s,box-shadow .2s}
.term:hover,.term:focus{background:#fff;box-shadow:0 0 0 3px #fff,0 0 16px color-mix(in srgb,var(--acc) 60%,transparent);outline:none}
.term.flash{animation:flash 1.2s 2}
@keyframes flash{50%{background:#ffd27a;box-shadow:0 0 0 4px #ffd27a,0 0 22px #ffb84d}}
.viz{background:#ffffffa8;border-radius:20px;padding:12px;position:sticky;top:80px;min-height:260px}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
.viz .cap{font-size:14px;color:var(--ink2);margin:6px 4px 0}
.viz svg text{font-family:"Atkinson Hyperlegible",sans-serif;fill:var(--ink)}
.viz .n{fill:#fff;stroke:var(--ink);stroke-width:1.5;transition:filter .25s,fill .25s}
.viz .n.acc,.viz .lit .n,.viz .n.lit{fill:color-mix(in srgb,var(--acc) 22%,#fff)}
.viz .lit .n,.viz .n.lit{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--acc) 80%,transparent))}
.viz g.h:hover .n,.viz .n.h:hover{filter:drop-shadow(0 0 10px var(--acc));fill:color-mix(in srgb,var(--acc) 30%,#fff)}
.viz g.h{cursor:default}
.viz .ln{stroke:var(--ink);stroke-width:1.6;fill:none;opacity:.55}
.viz .dash{stroke-dasharray:6 6}
.viz .dot{fill:var(--acc);filter:drop-shadow(0 0 6px var(--acc))}
.viz .pop{opacity:0}
.go .pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}
.viz .pop{transform-box:fill-box;transform-origin:center}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;font-size:15px}
.ctl label{display:flex;gap:8px;align-items:center;flex:1 1 200px}
.ctl input[type=range]{flex:1;accent-color:#1b2230;min-height:32px}
.ctl .btn{min-height:40px}
.hbar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 4.5em;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.hbar .tr{height:22px;background:#1b223012;border-radius:8px;overflow:hidden}
.hbar .fl{height:100%;background:var(--acc);border-radius:8px;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px color-mix(in srgb,var(--acc) 50%,transparent)}
.hbar span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font:700 clamp(34px,5vw,54px)/1 Lexend,sans-serif}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;align-items:center;gap:10px;padding:10px max(2vw,12px);background:#fbf8f2ee;backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.foot .where{flex:1;text-align:center;font-size:15px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .where b{color:var(--ink)}
.prog{position:absolute;left:0;top:-3px;height:3px;background:#1b2230;transition:width .3s}
.tip{position:fixed;z-index:80;max-width:320px;background:#1b2230;color:#fff;border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.45;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;box-shadow:0 10px 30px #0004}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-family:Lexend,sans-serif}
.tip small{display:block;margin-top:6px;color:#ffd27a}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:90;background:#fffdf8;box-shadow:-20px 0 60px #0003;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:18px 20px 10px;border-bottom:1px solid var(--line)}
.drawer h3{margin:0;font-size:26px}
.drawer header p{margin:6px 0 0}
.drawer .x{position:absolute;right:12px;top:12px}
.drawer .list{overflow:auto;padding:10px 14px 40px}
.drawer .grp{font:600 13px Lexend,sans-serif;color:var(--ink2);margin:14px 6px 6px}
.hit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;margin:6px 0;transition:box-shadow .2s}
.hit:hover{box-shadow:0 0 0 3px #ffd27a,0 0 18px #ffd27a99}
.hit b{display:block}
.hit small{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.hit mark{background:#ffd27a;border-radius:4px;padding:0 2px}
.hit .home{float:right;font-size:12px;background:#1b2230;color:#fff;border-radius:6px;padding:1px 6px}
.pill{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:50;background:#1b2230;color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:8px;box-shadow:0 10px 30px #0004;font-size:15px;max-width:calc(100vw - 20px);flex-wrap:wrap}
.pill.on{display:flex}
.pill button{min-height:40px;border-radius:12px;border:0;background:#ffd27a;color:#1b2230;padding:0 12px;font-weight:700}
.pill button.ghost{background:#ffffff22;color:#fff}
.book .foot .nav{display:none}
.cover .card{min-height:calc(100vh - 210px)}
.cv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.cv h1{font-size:clamp(90px,15vw,190px);line-height:.9;margin:0;letter-spacing:-2px}
.cv .by{font:500 clamp(20px,2.4vw,28px) Lexend,sans-serif;margin:6px 0 18px}
.cv .acts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.cv .acts .btn.pri{background:#1b2230;color:#fff;border-color:#1b2230}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:22px}
.toc button{border:0;border-radius:14px;padding:12px 14px;text-align:left;min-height:64px;transition:box-shadow .2s,transform .2s;font-size:15px}
.toc button:hover{transform:translateY(-2px);box-shadow:0 0 0 3px #fff,0 0 22px #1b223033}
.toc button small{display:block;color:var(--ink2);font-size:13px}
.hint{font-size:14px;color:var(--ink2)}
@media(max-width:980px){.has-viz .cols{grid-template-columns:minmax(0,1fr)}.viz{position:relative;top:0}.cv{grid-template-columns:minmax(0,1fr)}.outline{position:fixed;left:0;top:var(--th);z-index:45;box-shadow:20px 0 60px #0002}.wrap .outline{margin-left:-300px}.wrap.openo .outline{margin-left:0}.search input{width:150px}}
@media(max-width:600px){.top{position:relative;gap:6px}.top .btn,.seg button{padding:0 10px}body{font-size:16px}.brand span{display:none}table{font-size:13px}.search{order:5;flex:1 1 100%}.search input{width:100%}.results{width:100%}.slides .card{min-height:0}}
@media(prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@keyframes blink{50%{opacity:0}}
.mapv{position:fixed;inset:var(--th) 0 0 0;overflow:hidden;background:#f4f1ea;cursor:grab;touch-action:none}
.mapv.drag{cursor:grabbing}
.plane{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.ml{position:absolute;pointer-events:none}
.mh{position:absolute;font:700 80px Lexend,sans-serif;white-space:nowrap}
.ms{position:absolute;background:var(--bg);border-radius:28px;padding:26px 30px;box-shadow:0 20px 50px -30px #1b223066;transition:box-shadow .2s}
.ms:hover{box-shadow:0 0 0 6px #fff,0 0 60px color-mix(in srgb,var(--acc) 55%,transparent)}
.ms h3{font-size:52px;margin:0 0 14px;line-height:1.1}
.mp{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.mp button{border:2px solid #1b2230;background:#fff;border-radius:14px;padding:10px 16px;font-size:28px;font-weight:700}
.mp button:hover{background:#1b2230;color:#fff}
.mc{display:flex;flex-wrap:wrap;gap:8px}
.mc span{background:#ffffffc0;border-radius:12px;padding:8px 14px;font-size:28px}
.mc .term{border-bottom-width:3px}
.mapbar{position:absolute;right:14px;top:14px;display:flex;gap:6px;z-index:5;align-items:center;background:#fffdf8ee;border-radius:14px;padding:6px;box-shadow:0 8px 24px #0002}
.mapbar span{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.maphint{position:absolute;left:14px;top:14px;z-index:5;background:#fffdf8ee;border-radius:14px;padding:8px 12px;font-size:14px;max-width:min(420px,60vw)}
[hidden]{display:none!important}

.deep{margin-top:22px;padding-top:14px;border-top:2px solid #1b22301a}
.deep h3{margin-top:0;font-size:22px}
.deep p{margin:0 0 14px;line-height:1.7}

.mathd{display:block;overflow-x:auto;overflow-y:hidden;padding:6px 2px;margin:4px 0}
.katex{font-size:1.08em}
.mth{background:#ffffff70;border-radius:16px;padding:14px 18px;border-top:0}
.res{border-top-style:dashed}
.cites{font-size:.72em;line-height:0;white-space:nowrap}
.cite{color:var(--ink);text-decoration:none;font-weight:700;padding:0 1px;border-radius:4px}
.cite:hover{background:#ffd27a}
.body a:not(.cite){color:var(--ink);text-decoration-thickness:2px;text-underline-offset:3px}
.bib{padding-left:2.4em;margin:12px 0}
.bib li{margin:10px 0;line-height:1.5;border-radius:10px;padding:4px 6px}
.bib li.flash{animation:flash 1.2s 2}
.bib .bv{color:var(--ink2)}
.bib .bp{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.bib .bp button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:13px;cursor:pointer}
.bib .bp button:hover{background:#1b2230;color:#fff}
.cv h1{font-size:clamp(40px,4.4vw,70px);letter-spacing:-1px;line-height:.98}
</style><style id="tts-css">

.stage{padding-bottom:180px}
#tts{position:fixed;right:max(2vw,12px);bottom:74px;z-index:55;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#1b2230;color:#fff;border-radius:18px;padding:6px 8px;box-shadow:0 10px 30px #0004;font:500 14px/1.2 system-ui,sans-serif;max-width:calc(100vw - 24px)}
body.mapm #tts{bottom:14px}

#tts select option{color:#1b2230;background:#fff}

.tts-r{cursor:pointer;border-radius:8px;transition:background-color .2s,box-shadow .2s}
.tts-r:hover{background-color:color-mix(in srgb,var(--acc,#2b74b8) 8%,transparent)}
.tts-cur,.tts-cur:hover{background-color:color-mix(in srgb,#ffd27a 55%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,#ffd27a 55%,transparent)}

<body class="slides">
<header class="top">
<button class="btn" id="olb" type="button" aria-label="Toggle outline">☰ Outline</button>

<script>{
const BOOK=[{"t": "Start here", "s": [["cover", "Masterchef", "", {"type": "cover"}], ["how", "How this book works", "This book takes you from **survival cooking** (healthy food every day, from zero) to cooking any cuisine on earth.\n- **Read** a page, then **cook** its dishes. Every dish in this book is a recipe in the Project Masterchef app.\n- **Cook every dish twice.** The first time you follow. The second time you cook.\n- **Taste at every stage.** Salt, acid, fat and heat get adjusted while you cook, not after.\n- **Use a thermometer** for meat. Colour lies; thermometers don't.\n- **Write it down** in the app's cook log after every attempt.\n> Mistakes are the curriculum. Every recipe has an \"if it goes wrong\" section for a reason.", {"type": "loop", "steps": ["Read the page", "Cook it once", "Cook it twice", "Log what changed", "Drill the lesson"]}], ["levels", "The four levels", "| Level | You can… | Parts |\n| **Apprentice** | Feed yourself healthy food every day and keep it safe | 1 |\n| **Cook** | Control heat, knives and seasoning; the six-dish path cooked twice | 2–3 |\n| **Chef** | Use the mother techniques; cook confidently from five or more cuisines | 4–5 |\n| **Masterchef** | Taste, plan, time and plate a multi-course meal; invent dishes that work | 6 |\n- Set up your **health profile** in the app first. Recipe pages then show your portion and warn about anything that clashes with your diet, allergies or conditions.\n- This book is general cooking and nutrition information, not medical advice. Your doctor, dietitian or pharmacist outranks it.", {"type": "stack", "layers": ["Masterchef", "Chef", "Cook", "Apprentice"]}]]}, {"t": "Survival: what your body needs", "s": [["plate", "The balanced plate", "Surviving well isn't about a perfect diet. It's about hitting a few targets most days with food you actually like.\n- **Half the plate**: vegetables and fruit. Fresh, frozen and canned all count.\n- **A quarter**: **protein foods**. Eggs, chicken, fish, tofu, beans, lentils, yogurt.\n- **A quarter**: **whole grains**. Brown rice, oats, whole-wheat pasta, whole-grain bread.\n- **Water** as your usual drink.\nThat's the plate in Canada's food guide, which also says to choose plant-based protein more often [@cfg_plate]. It works for mixed dishes too: a stir-fry, a curry or a soup can still be half vegetables.", {"type": "plate", "segs": [["Vegetables + fruit", 0.5], ["Protein foods", 0.25], ["Whole grains", 0.25]]}], ["macros", "Macros and calories in plain words", "| Nutrient | kcal per gram | What it does | Where you get it |\n| **Protein** | 4 | Builds and repairs muscle, keeps you full | Meat, fish, eggs, dairy, tofu, beans, lentils |\n| **Carbohydrates** | 4 | Your main fuel | Grains, fruit, vegetables, legumes |\n| **Fat** | 9 | Essential, but dense | Olive oil, nuts, seeds, fish |\n| **Fibre** | ~2 | Digestion, fullness, cholesterol | Beans, oats, vegetables, fruit, whole grains |\n| **Alcohol** | 7 | Nothing useful | Drinks, and wine in sauces |\n- **Calories** are your energy budget. The app estimates yours with the **Mifflin-St Jeor** equation from your weight, height, age and sex [@mifflin1990], then adjusts for activity and goal.\n- Most adults need **25–38 g of fibre** a day and many get half that.", {"type": "bars", "items": [["Fat", 9], ["Alcohol", 7], ["Protein", 4], ["Carbohydrates", 4]], "unit": "Calories per gram: fat is more than twice as dense as protein or carbs."}], ["sodium", "Salt and sodium", "**Sodium** is the part of salt your blood pressure cares about.\n- Health Canada recommends most people aim for about **1,500 mg** a day and stay **under 2,300 mg** [@hc_sodium]. That's just over one teaspoon of salt.\n- Most sodium comes from **processed and restaurant food**, not your salt shaker. Sauces, broth, cheese, cured meat, soy sauce and stock cubes add up fast.\n- The app's recipe cards show sodium per serving. Several healthy dishes are still salty: phở, tom yum and pad thai all run over 2,000 mg.\n## Cut sodium without losing flavour\n- Use **low-sodium broth** and rinse canned beans.\n- Salt at the end, **after tasting**.\n- Use **acid** (lemon, vinegar), herbs, garlic, chili and **umami** (tomato paste, mushrooms) instead.\n- Measure soy sauce and fish sauce by the teaspoon.", {"type": "bars", "items": [["Daily limit", 2300], ["Daily aim", 1500], ["1 tbsp soy sauce", 900], ["1 stock cube", 900], ["1 tsp salt", 2300]], "unit": "Milligrams of sodium (approximate; check labels)."}], ["why-cook", "Why home cooking is the survival skill", "Restaurant and packaged food is engineered for flavour, which usually means more salt, sugar and fat than you'd add yourself. When you cook, you hold the salt shaker.\n- You control **portions**: the app scales every recipe to \"your portion\" from your height and goal.\n- You control **cost**: most survival dishes in the app cost a few dollars a serving.\n- You control **what goes in**: allergies, diets and health conditions are flagged on every recipe.\n> Cooking at home is the single biggest health upgrade in this book.", {"type": "flows", "rows": [["Takeout", "Their salt", "Their portion", "Their price"], ["Home", "Your salt", "Your portion", "Your price"]]}]]}, {"t": "Survival: pantry and dishes", "s": [["pantry", "The survival pantry", "A stocked pantry is what stops you ordering takeout at 9 pm.\n| Where | Keep |\n| **Cupboard** | Rolled oats, rice, whole-wheat pasta, red lentils, canned chickpeas and beans, canned tomatoes, tomato paste, low-sodium broth, peanut butter or tahini, olive oil, a high-heat oil, vinegar, soy sauce, onions, garlic, potatoes |\n| **Spices** | Kosher salt, black pepper, cumin, coriander, smoked paprika, chili flakes, garam masala, dried oregano, cinnamon |\n| **Fridge** | Eggs, plain yogurt, lemons, tofu or chicken thighs, carrots, cabbage, greens, parmesan |\n| **Freezer** | Frozen vegetables and berries, fish fillets or shrimp, your own batch-cooked meals, sliced bread |\n- **Frozen vegetables** are picked ripe, just as nutritious, and never go bad.\n- The app's grocery list counts packs, prices the trip and leaves pantry staples out unless you say you're out.", {"type": "hub", "center": "Survival pantry", "spokes": ["Oats", "Lentils", "Canned beans", "Canned tomato", "Eggs", "Yogurt", "Frozen veg", "Rice"]}], ["cheap", "Cheap and healthy, ranked", "Per serving, the cheapest nutrition you can buy is dried **lentils**, **beans**, oats, eggs, cabbage, carrots, frozen vegetables and canned fish.\nThese are the cheapest survival dishes in the app, with their estimated cost and nutrition per serving:\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Dal tadka](../#/recipe/dal-tadka) | $0.76 | 243 | 13 g | 6 g | 320 mg |\n| [Chana masala](../#/recipe/chana-masala) | $1.63 | 301 | 12 g | 11 g | 757 mg |\n| [Lentil shepherd’s pie](../#/recipe/lentil-shepherds) | $1.52 | 380 | 15 g | 10 g | 787 mg |\n| [Gigantes plaki](../#/recipe/gigantes) | $1.84 | 326 | 14 g | 13 g | 942 mg |\n| [Crispy roasted chickpeas](../#/recipe/roasted-chickpeas) | $0.85 | 206 | 9 g | 8 g | 434 mg |\n- The \"Under $2.50 a serving\" folder in the app's recipes is the budget survival menu. Prices are estimates you can edit.", {"type": "bars", "items": [["Lemon garlic salmon", 7.89], ["Overnight oats", 2.51], ["Gigantes plaki", 1.84], ["Chana masala", 1.63], ["Lentil shepherd’s", 1.52], ["Crispy roasted", 0.85], ["Dal tadka", 0.76]], "key": "cost", "unit": "Estimated cost per serving, in dollars, from the app's grocery prices."}], ["sv-breakfast", "Survival breakfasts", "Start the day with protein and fibre and lunch takes care of itself.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Overnight oats](../#/recipe/overnight-oats) | $2.51 | 385 | 18 g | 10 g | 149 mg |\n| [Avocado toast with a jammy egg](../#/recipe/avocado-toast) | $1.78 | 305 | 12 g | 6 g | 342 mg |\n| [Tofu scramble](../#/recipe/tofu-scramble) | $3.16 | 386 | 25 g | 5 g | 558 mg |\n| [Soft scrambled eggs on toast](../#/recipe/eggs) | $2.05 | 537 | 28 g | 2 g | 827 mg |\n- **Overnight oats** need no cooking: mix tonight, eat tomorrow.\n- The **jammy egg** teaches timing: 6–7 minutes in boiling water, then ice.\n- **Scrambled eggs** are also dish one of the six-dish path, because they teach heat control.", {"type": "bars", "items": [["Soft scrambled eggs", 28], ["Tofu scramble", 25], ["Overnight oats", 18], ["Avocado toast with a", 12]], "key": "P", "unit": "Grams of protein per serving."}], ["sv-lunch", "Survival lunches: salads and bowls that keep", "Make once, eat three times. Salads built on beans, grains and sturdy vegetables keep for days in the fridge.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Mediterranean chickpea salad](../#/recipe/chickpea-salad) | $2.82 | 369 | 10 g | 10 g | 713 mg |\n| [Warm black bean and kale salad](../#/recipe/black-bean-kale) | $2.98 | 358 | 11 g | 11 g | 420 mg |\n| [Buddha bowl with tahini dressing](../#/recipe/buddha-bowl) | $3.35 | 754 | 23 g | 19 g | 490 mg |\n- The **Buddha bowl** is the template for a balanced plate: grain + protein + vegetables + sauce.\n- Dress leafy salads just before eating; dress bean and grain salads ahead (they get better).", {"type": "split3", "cols": [["Base", "Grain", "Beans", "Greens"], ["Add", "Protein", "Crunch", "Something rich"], ["Finish", "Acid", "Herbs", "Salt"]]}], ["sv-dinner", "Survival dinners", "**Lentils** and **chickpeas** are the survival super-foods: protein, lots of fibre, very cheap, and they reheat well. Dal and chana masala also teach your first spice technique, blooming spices in hot fat.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Dal tadka](../#/recipe/dal-tadka) | $0.76 | 243 | 13 g | 6 g | 320 mg |\n| [Chana masala](../#/recipe/chana-masala) | $1.63 | 301 | 12 g | 11 g | 757 mg |\n| [Aloo gobi](../#/recipe/aloo-gobi) | $1.81 | 249 | 6 g | 7 g | 330 mg |\n| [Lemon garlic salmon with asparagus](../#/recipe/salmon-asparagus) | $7.89 | 530 | 39 g | 5 g | 375 mg |\n| [Sheet-pan chicken thighs with roasted vegetables](../#/recipe/sheet-pan-chicken) | $7.01 | 1089 | 56 g | 13 g | 1,100 mg |\n- **Salmon** is a 25-minute dinner with omega-3 fats.\n- **Sheet-pan chicken** is a whole dinner on one tray. It makes big portions; check \"your portion\" in the app.", {"type": "bars", "items": [["Sheet-pan chicken", 13], ["Chana masala", 11], ["Aloo gobi", 7], ["Dal tadka", 6], ["Lemon garlic salmon", 5]], "key": "fib", "unit": "Grams of fibre per serving."}], ["sv-batch", "Batch cooking: cook once, eat five times", "**Batch cooking** is the survival strategy: big pots on Sunday, easy meals all week.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Big-pot beef and bean chili](../#/recipe/chili) | $2.96 | 381 | 24 g | 10 g | 800 mg |\n| [Minestrone](../#/recipe/minestrone) | $2.28 | 272 | 12 g | 8 g | 1,219 mg |\n| [Lentil shepherd’s pie](../#/recipe/lentil-shepherds) | $1.52 | 380 | 15 g | 10 g | 787 mg |\n- Cool fast in **shallow containers**, fridge what you'll eat in 3–4 days, freeze the rest with a date label.\n- Soups and chili can run high in sodium: low-sodium broth, rinsed beans, salt at the end.", {"type": "flow", "steps": ["Big pot|Sunday", "Cool fast|shallow boxes", "Fridge|3–4 days", "Freezer|months", "Reheat|to 74°C / 165°F"]}], ["sv-snacks", "Healthy snacks, sides and smoothies", "| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Crispy roasted chickpeas](../#/recipe/roasted-chickpeas) | $0.85 | 206 | 9 g | 8 g | 434 mg |\n| [Garlic chili edamame](../#/recipe/edamame) | $0.99 | 82 | 7 g | 3 g | 218 mg |\n| [Stovetop popcorn](../#/recipe/popcorn) | $0.31 | 308 | 4 g | 5 g | 235 mg |\n| [Garlic bok choy](../#/recipe/bok-choy) | $1.35 | 84 | 3 g | 2 g | 395 mg |\n| [Berry banana smoothie](../#/recipe/berry-smoothie) | $2.78 | 238 | 11 g | 4 g | 64 mg |\n| [Chocolate peanut butter smoothie](../#/recipe/pb-smoothie) | $2.31 | 513 | 30 g | 8 g | 158 mg |\n- A **smoothie** is a fast way to get fruit, greens and protein in. Add yogurt, milk, tofu or peanut butter for protein, and keep the whole fruit (juice loses the fibre).", {"type": "bars", "items": [["Chocolate peanut", 513], ["Stovetop popcorn", 308], ["Berry banana", 238], ["Crispy roasted", 206], ["Garlic chili edamame", 82]], "key": "kcal", "unit": "Calories per serving."}], ["sv-week", "Your first survival week", "The trick to eating well every day isn't cooking every day. It's cooking twice a week and assembling the rest.\n| Day | Do |\n| **Sunday** (2 h) | Shop from the app's grocery list. Make chili and dal, three jars of overnight oats and a chickpea salad. Cool, fridge, freeze. |\n| **Mon–Wed** | Oats, chickpea salad, chili or dal with rice. |\n| **Wednesday** (30 min) | One fresh dinner (salmon or stir-fry) and a pot of rice. |\n| **Thu–Sun** | Eggs on toast, leftovers and frozen portions. |\n- Rate each dish in the cook log. After a month you'll know your real five-dish survival kit.", {"type": "timeline", "items": [["Sun", "batch cook"], ["Mon", "oats + salad"], ["Tue", "chili"], ["Wed", "fresh dinner"], ["Thu", "dal + rice"], ["Fri", "freezer meal"]]}]]}, {"t": "Survival: food safety", "s": [["temps", "Safe internal temperatures", "Use an instant-read **thermometer** in the thickest part, not touching bone. Health Canada and the USDA don't always agree, so here are both:\n| Food | Health Canada | USDA |\n| Poultry pieces and ground poultry | 74°C (165°F) | 165°F (74°C) |\n| Whole poultry | 82°C (180°F) | 165°F (74°C) |\n| Ground beef, pork, lamb | 71°C (160°F) | 160°F (71°C) |\n| Beef, veal, lamb steaks and roasts | 63°C (145°F) medium-rare | 145°F (63°C) + 3-min rest |\n| Pork chops and roasts | 71°C (160°F) | 145°F (63°C) + 3-min rest |\n| Fish | 70°C (158°F) | 145°F (63°C) |\n| Egg dishes | 74°C (165°F) | 160°F (71°C) |\n| Leftovers, reheated | 74°C (165°F) | 165°F (74°C) |\nSources: Health Canada [@hc_temps] and USDA [@fsis_temps]. When they differ, the higher number is the cautious choice, and it's the one to use for anyone pregnant, very young, older or with a weak immune system.", {"type": "thermo", "marks": [[63, "Beef steak (both)"], [70, "Fish (Health Canada)"], [71, "Ground meat, pork (HC)"], [74, "Poultry pieces, leftovers"], [82, "Whole poultry (HC)"]]}], ["danger", "The danger zone and the 2-hour rule", "Bacteria grow fastest between **4°C and 60°C (40–140°F)**: the **danger zone**. In that range they can double in as little as 20 minutes [@fsis_danger].\n- Refrigerate cooked food **within 2 hours**, or within 1 hour if it's above 32°C (90°F) [@fsis_danger].\n- Fridge at or below 4°C (40°F); freezer at −18°C (0°F).\n- Cool big batches fast in **shallow containers**.\n- **Thaw** in the fridge, in cold water changed every 30 minutes, or in the microwave if you're cooking right away. Never on the counter.\n- **Leftovers**: eat within 3–4 days and reheat to 74°C (165°F) [@fsis_leftovers].", {"type": "danger"}], ["clean", "Clean habits", "- **Never rinse raw chicken.** The splash spreads bacteria around the sink. Pat it dry instead.\n- **Separate boards**: one for raw meat, one for produce, or cut produce first.\n- **Wash hands** for 20 seconds after raw meat and eggs.\n- **Marinade** that touched raw meat must be boiled before it's used as a sauce.\n- **Cooked rice**: cool it and refrigerate it within an hour or two. *Bacillus cereus* spores survive cooking, grow in warm rice and make a toxin that reheating does not destroy [@wa_rice].", {"type": "flows", "rows": [["Raw meat", "Its own board", "Hot soapy wash", "Then produce"], ["Cooked rice", "Spread to cool", "Fridge < 2 h", "Reheat once"]]}], ["risky", "Foods that are dangerous if done wrong", "Every cuisine has a few ingredients that need specific handling. You'll meet them in the atlas; here's the master list.\n| Food | The rule |\n| **Dried red kidney beans** | Soak at least 5 hours, discard the water, then boil vigorously for at least 10 minutes [@hc_lectins]. Never cook them from dry in a slow cooker. Canned beans are already safe. |\n| **Garlic or herbs in oil** | Homemade infused oils can grow botulism at room temperature. Fridge them and use within a few days, or freeze. |\n| **Home canning** | Low-acid foods (vegetables, meat, beans) need a pressure canner and a tested recipe [@nchfp]. |\n| **Raw fish** (sushi, ceviche, poke) | Buy fish sold for raw eating or previously frozen to kill parasites. Lime juice doesn't kill bacteria. |\n| **Mussels and clams** | Must be alive before cooking. Throw away any that don't open when cooked [@hc_temps]. |\n| **Cassava** | Peel and cook fully; never eat it raw. |\n| **Fiddleheads** | Boil 15 minutes or steam 10–12, and discard the water [@hc_fiddle]. |\n| **Ackee** | Only canned, or fruit that opened naturally on the tree with seeds and membrane removed. |\n| **Wild mushrooms, pufferfish** | Not home ingredients. |", {"type": "split", "lt": "Raw: danger", "rt": "Done right: safe", "left": ["Raw kidney beans", "Raw cassava", "Raw fiddleheads", "Garlic oil on counter"], "right": ["Soak + hard boil", "Peel + cook fully", "Boil 15 / steam 12", "Fridge, few days"]}], ["fire", "Fire, burns and allergens", "## Fire and burns\n- **Grease fire**: turn off the heat, smother it with a lid or baking sheet. **Never throw water on it.**\n- Keep a kitchen fire extinguisher (class K or ABC).\n- Turn pan handles inward. Dry food before it goes into hot oil; water makes oil spit.\n- **Deep-frying**: never fill a pot more than halfway, and use a thermometer (175–190°C / 350–375°F).\n## Allergens\nAsk guests first. The main ones: peanuts, tree nuts, milk, eggs, wheat (gluten), soy, fish, shellfish, sesame and mustard.\n- Hidden sources: soy sauce (wheat), pesto (nuts), Worcestershire and Caesar dressing (fish), many curry pastes (shrimp), most gochujang (wheat).\n- The app flags allergens on every recipe against your profile.", {"type": "flow", "steps": ["Flames!|stay calm", "Heat off", "Lid on|smother", "Leave it|until cool"]}]]}, {"t": "Foundations: kit and knives", "s": [["kit", "Your kit", "You don't need a gadget drawer. You need about a dozen good tools.\n| Tool | Use |\n| **Chef's knife** | Almost all cutting. Hone weekly, sharpen a few times a year. |\n| **Non-stick skillet** | Eggs, pancakes, delicate fish. Low–medium heat, never empty on high. |\n| **Cast iron or stainless skillet** | Searing and browning; stainless makes **fond** for pan sauces. |\n| **Dutch oven** | Soups, stews, braises, bread. Stove to oven. |\n| **Sheet pan** | Roasting and sheet-pan dinners. |\n| **Instant-read thermometer** | Safety and doneness. |\n| **Kitchen scale** | Baking. Press tare to zero it. |\n| Microplane, tongs, spatula, whisk | Your hands, extended. |\n- Later: a **wok**, a blender, a mortar and pestle, a stand mixer.", {"type": "hub", "center": "Core kit", "spokes": ["Chef's knife", "Boards", "Non-stick pan", "Cast iron", "Dutch oven", "Sheet pan", "Thermometer", "Scale"]}], ["knife-grip", "Grip, guide and the claw", "Good knife work is about **safety** and **evenness**: even pieces cook evenly. A sharp knife is safer than a dull one, because it goes where you aim instead of slipping.\n- **Pinch grip**: thumb and index finger pinch the blade just in front of the handle.\n- **The claw**: curl the fingertips of your other hand under, so your knuckles guide the side of the blade.\n- **Stable base**: cut a flat side onto round things so they don't roll. A damp towel under the board stops it sliding.\n- Rock or glide forward; don't chop straight down with force.", {"type": "flow", "steps": ["Flat side down", "Pinch grip", "Claw hand", "Glide forward"]}], ["cuts", "The cuts every recipe asks for", "| Cut | Size | Used for |\n| **Small dice** | ~6 mm (¼ in) | Salsas, soffritto |\n| **Medium dice** | ~1 cm (½ in) | Soups, stews, roasting |\n| **Mince** | As fine as possible | Garlic, ginger, chili |\n| **Julienne** | Matchsticks | Stir-fries, slaws |\n| **Chiffonade** | Ribbons of rolled leaves | Basil, mint |\n| **Against the grain** | Across the muscle fibres | Meat, so every bite is tender |\n## The onion, properly\n1. Halve through the root; peel; keep the root on.\n2. Lay flat. Cut towards the root, not through it.\n3. Optional: one or two horizontal cuts.\n4. Slice across. Perfect dice falls away.", {"type": "flow", "steps": ["Halve|through root", "Peel", "Vertical cuts|to the root", "Slice across|dice!"]}]]}, {"t": "Foundations: heat", "s": [["stove", "Reading your stove", "Cooking is controlling heat.\n| Setting | Use | Looks like |\n| **Low** (1–3) | Melting, gentle simmer, rice | A few lazy bubbles |\n| **Medium** (4–6) | Onions, eggs, pancakes | Steady sizzle |\n| **Medium-high** (7–8) | Browning, searing, stir-fries | Oil shimmers, food hisses |\n| **High** (9–10) | Boiling water, wok, hard sear | Watch closely |\nA **simmer** has small bubbles breaking gently; a **boil** is big, rolling and constant. Most soups, stews and sauces want a simmer: boiling toughens meat and splits sauces.", {"type": "simmer"}], ["maillard", "Dry heat and browning", "Searing, roasting, grilling, broiling, stir-frying and frying are **dry heat**. Above about 140–165°C (285–330°F), proteins and sugars react and brown: the **Maillard reaction**, which creates hundreds of flavour compounds. Sugars alone brown by **caramelization** at higher temperatures.\n- **Wet food can't brown**: while there's water on the surface it stays near 100°C. Pat food dry.\n- **Don't crowd the pan**: crowded food steams in its own juices.\n- **Leave it alone**: let a crust form before you flip.\n- Past brown is **burnt**: bitter, acrid. Garlic burns fastest.", {"type": "maillard"}], ["wet", "Wet heat, braising and resting", "**Wet heat** (boiling, simmering, poaching, steaming, braising) never goes much above 100°C. It's gentle and even, perfect for delicate foods (fish, eggs) and for tough cuts, whose **collagen** melts into gelatin after hours at a low simmer.\n- **Braising** = sear for flavour, then cook slowly, partly covered in liquid, until fork-tender.\n- **Carry-over cooking**: meat keeps rising 3–5°C (5–10°F) after it leaves the heat. Pull it a little early.\n- **Resting** (5 minutes for steaks, 15 for roasts) lets juices settle.", {"type": "carry"}], ["ovens", "Ovens, broilers and air fryers", "- **Preheat** 15–20 minutes. Middle rack for most things.\n- **Convection** (fan): lower the temperature 15°C (25°F), or check 25% sooner.\n- **Broiler**: top rack, door watched. Golden to burnt in under a minute.\n- **Air fryer**: a small convection oven, usually 190–200°C (375–400°F). Don't overcrowd; shake halfway.\n| Common temperatures | Use |\n| 150–165°C (300–325°F) | Braises, slow roasts |\n| 175°C (350°F) | Cakes, cookies, casseroles |\n| 200–220°C (400–425°F) | Roast vegetables, chicken |\n| 230–290°C (450–550°F) | Pizza, bread, hard roasting |", {"type": "bars", "items": [["Pizza", 260], ["Roast vegetables", 220], ["Roast chicken", 220], ["Cookies", 175], ["Braise", 150]], "unit": "Typical oven temperatures, °C."}]]}, {"t": "Foundations: fat, measuring and doneness", "s": [["smoke", "Oils, fats and smoke points", "Fat carries flavour, conducts heat and makes things crisp. The **smoke point** is where a fat starts to smoke, turn bitter and give off irritating fumes.\n| Heat | Fats |\n| **High** (searing, wok, frying) | Avocado, refined peanut, canola, light olive oil, ghee |\n| **Medium** (everyday sautéing) | Extra-virgin olive oil, butter |\n| **None** (finishing, dressing) | Extra-virgin olive oil, toasted sesame oil, flaxseed oil |\n- **Unsaturated fats** (olive, canola, avocado, nut oils) are linked with better heart health. **Saturated fats** (butter, ghee, coconut oil, lard) are best in moderation.\n- All fats are about 9 kcal per gram: measure your oil instead of glugging it.", {"type": "bars", "items": [["Avocado oil", 500], ["Ghee", 470], ["Light olive oil", 465], ["Peanut (refined)", 450], ["Canola", 425], ["Extra-virgin olive", 390], ["Toasted sesame", 350], ["Butter", 325], ["Flaxseed", 225]], "unit": "Approximate smoke points, °F. They vary by brand and refinement."}], ["ratios", "Measuring and the ratios that free you", "Cooking is forgiving; baking isn't. Weigh when you bake; taste as you go when you cook.\n| Ratio | Recipe |\n| **Vinaigrette** | 3 oil : 1 acid + salt + a little mustard |\n| **White rice** | 1 rice : 1½ water, 15 min covered + 10 min rest |\n| **Brown rice / quinoa** | 1 : 2 |\n| **Roux** | Equal weights fat and flour |\n| **Béchamel** | ~2 tbsp butter + 2 tbsp flour per cup of milk |\n| **Bread** | 100 flour : 65–70 water : 2 salt : 1 yeast (by weight) |\n| **Pie crust** | 3 flour : 2 fat : 1 cold water (by weight) |\n| **Brine** | ~5–6% salt (meat); 2–3% (vegetable ferments) |\n- 3 tsp = 1 tbsp; 16 tbsp = 1 cup; 1 cup = 250 ml (Canadian metric) or 240 ml (US recipes); 1 lb = 454 g.", {"type": "rice"}], ["portions", "Portions", "| Food | Per person (main course) |\n| Dry pasta | About 100 g |\n| Raw meat or fish | 120–170 g |\n| Rice | 1 cup dry feeds 3–4 as a side |\n| Vegetables | Half the plate |\n- People are different sizes. Once your profile is set, every recipe page in the app shows **your portion** (\"about 1.25 servings\"), scaled from your height and goal.", {"type": "plate", "segs": [["Vegetables", 0.5], ["120–170 g protein", 0.25], ["~100 g dry grain", 0.25]]}], ["cuts-meat", "Tender cuts, tough cuts", "There are only two kinds of meat:\n| Kind | Examples | Cook |\n| **Tender** | Steaks, chops, breast, tenderloin, fish | Hot and fast; pull at temperature; rest |\n| **Tough** | Chuck, short ribs, shoulder, shank, brisket | Low and slow until about 93°C (200°F) inside, when collagen melts |\n- Chicken thighs are safe at 74°C but most tender at 80–85°C (175–185°F).\n- Thin things: **fish** flakes and turns opaque; **shrimp** turn pink and curl into a C (an O means overcooked).\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Sheet-pan chicken thighs with roasted vegetables](../#/recipe/sheet-pan-chicken) | $7.01 | 1089 | 56 g | 13 g | 1,100 mg |\n| [Picanha (churrasco steak)](../#/recipe/picanha) | $8.51 | 680 | 51 g | 0 g | 958 mg |\n| [Lemon garlic salmon with asparagus](../#/recipe/salmon-asparagus) | $7.89 | 530 | 39 g | 5 g | 375 mg |", {"type": "split", "lt": "Tender: fast", "rt": "Tough: slow", "left": ["Steak · sear", "Chicken breast · roast", "Fish · pan-fry", "Pork chop · grill"], "right": ["Chuck · braise", "Short ribs · braise", "Pork shoulder · slow roast", "Brisket · smoke"]}]]}, {"t": "Foundations: seasoning and flavour", "s": [["levers", "The flavour levers", "Most bland food isn't missing an ingredient. It's missing **salt** or **acid**.\n| Lever | What it does |\n| **Salt** | Makes food taste more like itself. Season a little at each stage. |\n| **Acid** | Lemon, lime, vinegar, tomato, yogurt. Brightens heavy or dull food. The most-forgotten lever. |\n| **Fat** | Carries flavour and adds richness. |\n| **Heat** | Chili heat, and the browning heat of cooking. |\n| **Sweet** | Balances acid, bitterness and chili. |\n| **Bitter** | Greens, coffee, char. A little adds depth. |\n| **Umami** | Savoury depth: soy sauce, parmesan, tomato paste, miso, mushrooms, fish sauce, anchovy. |", {"type": "hub", "center": "Delicious", "spokes": ["Salt", "Acid", "Fat", "Heat", "Sweet", "Bitter", "Umami"]}], ["taste-fix", "Taste and fix", "Taste before you serve, every time.\n| Problem | Fix |\n| Flat, boring | **Salt** first, then **acid** |\n| Too salty | Add unsalted bulk (water, potato, beans), acid or fat. You can't remove salt. |\n| Too sour | A little sweetness or fat |\n| Too spicy | Dairy, coconut milk, sugar, starch, or more of everything else |\n| Too sweet | Acid, salt or bitterness |\n| Heavy, greasy | Acid and fresh herbs |\nTry the balancer: move the sliders and see what a cook would do next.", {"type": "balance"}], ["layers", "Building flavour in layers", "- **Aromatics** (onion, garlic, ginger, celery, carrot, chili) cooked in fat at the start.\n- **Bloom spices**: ground spices in hot oil for 30–60 seconds wakes them up.\n- **Toast whole spices** in a dry pan until fragrant, then grind.\n- **Hardy herbs** (rosemary, thyme, bay) go in early; **soft herbs** (basil, cilantro, parsley, mint) at the end.\n- **Deglaze**: splash liquid into the hot pan and scrape up the **fond**. Free flavour.\n- **Finish**: a squeeze of citrus, a drizzle of good oil, fresh herbs, flaky salt.\n> Every cuisine has a **flavour base**: the aromatics it starts almost everything with. Learn the base and you can cook a hundred dishes from that region.", {"type": "flow", "steps": ["Fat|hot pan", "Aromatics|soften", "Spices|bloom", "Liquid|deglaze", "Simmer|build", "Finish|acid + herbs"]}]]}, {"t": "The six-dish path", "s": [["six", "Six dishes, six techniques", "The Home screen of the app is the **six-dish path**. Each dish was chosen to teach one technique you'll use for the rest of your life. Two dots fill in as you cook each one twice.\n| # | Dish | Teaches |\n| 1 | Scrambled eggs | **Heat control**: pull them while glossy |\n| 2 | Sheet-pan chicken | Roasting and doneness: own a thermometer |\n| 3 | Big-pot chili | Building flavour in layers; batch cooking |\n| 4 | Stir-fry with rice | Knife work and high heat |\n| 5 | Garlic tomato pasta | Pan sauces and **pasta water** |\n| ★ | Roast chicken + salad | **Hosting**: timing several things for other people |", {"type": "flow", "steps": ["Eggs|heat", "Sheet pan|roasting", "Chili|flavour", "Stir-fry|knife + wok", "Pasta|pan sauce", "Roast chicken|hosting"]}], ["six-cards", "The path, with numbers", "| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Soft scrambled eggs on toast](../#/recipe/eggs) | $2.05 | 537 | 28 g | 2 g | 827 mg |\n| [Sheet-pan chicken thighs with roasted vegetables](../#/recipe/sheet-pan-chicken) | $7.01 | 1089 | 56 g | 13 g | 1,100 mg |\n| [Big-pot beef and bean chili](../#/recipe/chili) | $2.96 | 381 | 24 g | 10 g | 800 mg |\n| [Chicken and vegetable stir-fry with rice](../#/recipe/stir-fry) | $5.14 | 765 | 36 g | 8 g | 1,471 mg |\n| [Garlic, cherry tomato and basil pasta](../#/recipe/pasta) | $4.67 | 790 | 26 g | 6 g | 603 mg |\n| [Lemon herb roast chicken, with a big green salad](../#/recipe/roast-chicken) | $9.65 | 1396 | 79 g | 10 g | 1,533 mg |\n- One new dish a week is a good pace.\n- After each, write one line in the cook log: what you'd change next time.", {"type": "checklist", "key": "six", "items": ["Scrambled eggs, twice", "Sheet-pan chicken, twice", "Big-pot chili, twice", "Stir-fry with rice, twice", "Garlic tomato pasta, twice", "Roast chicken dinner for friends, twice"]}], ["hosting", "Hosting the milestone dinner", "The roast chicken recipe has a **timeline**. Work backwards from when you want to eat.\n- The bird **rests** 15 minutes: exactly when you dress the salad and carve.\n- Ask guests about **allergies** and diets when you invite them, not at the door.\n- Make dessert the day before.\n- **Mise en place**: everything prepped before the oven goes on.", {"type": "timeline", "items": [["−2 h", "prep, oven on"], ["−1:45", "chicken in"], ["−40", "potatoes, wash greens"], ["−15", "rest bird, dress salad"], ["0", "carve + serve"]]}]]}, {"t": "Mother techniques: stocks and sauces", "s": [["stocks", "Stocks and broths", "A **stock** is water taught to taste of something: the base of soups, sauces, risottos and braises everywhere.\n| Stock | How |\n| **Chicken** | Bones or wings, onion, carrot, celery, bay, peppercorns. Barely simmer 3–4 h. Never boil hard. |\n| **Brown** (beef) | Roast bones and vegetables first; 6–8 h. |\n| **Fish / shellfish** | Frames or shrimp shells; only 20–40 min or it turns bitter. |\n| **Vegetable** | Onion, carrot, celery, mushrooms, leek tops; 45 min. |\n| **Dashi** (Japan) | Kombu and bonito flakes, steeped not boiled: 10 minutes. |\n| **Phở broth** | Charred onion and ginger, toasted star anise, cinnamon, clove. |\n- Salt stock lightly or not at all; it gets reduced later.", {"type": "flow", "steps": ["Bones / veg", "Cold water", "Barely simmer", "Skim", "Strain", "Cool fast"]}], ["soups", "Soup families", "| Family | Examples in the app |\n| Brothy | Chicken noodle, phở, miso, avgolemono |\n| Puréed | Roasted butternut squash |\n| **Bisque** | Shrimp bisque (shellfish stock, enriched, blended) |\n| **Chowder** | Clam, corn (thickened with roux or potatoes) |\n| Hearty | Minestrone, lentil |\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Chicken noodle soup](../#/recipe/chicken-noodle) | $2.76 | 253 | 20 g | 2 g | 1,074 mg |\n| [Roasted butternut squash soup](../#/recipe/butternut-soup) | $2.04 | 299 | 7 g | 6 g | 885 mg |\n| [Shrimp bisque](../#/recipe/shrimp-bisque) | $5.53 | 390 | 27 g | 2 g | 1,285 mg |\n| [Phở gà (chicken pho)](../#/recipe/pho-ga) | $7.33 | 588 | 54 g | 3 g | 2,400 mg |\n- Blending hot soup: fill the blender only a third, vent the lid, cover with a towel.", {"type": "split3", "cols": [["Brothy", "Chicken noodle", "Phở", "Miso"], ["Puréed", "Squash", "Bisque", "Corn chowder"], ["Hearty", "Minestrone", "Lentil", "Clam chowder"]]}], ["roux", "Roux sauces and pan sauces", "## Thickened with a roux\nCook equal parts fat and flour, then whisk in liquid. With milk: **béchamel** (mac and cheese, lasagne, croque monsieur). With stock: **velouté**. Cook the roux longer for colour, all the way to the dark roux of gumbo.\n## Pan sauces\nSear meat, pour off excess fat, **deglaze** with wine or stock, scrape up the **fond**, reduce, then swirl in cold butter off the heat.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Stovetop mac and cheese](../#/recipe/mac-cheese) | $2.44 | 664 | 31 g | 2 g | 908 mg |\n| [Croque monsieur](../#/recipe/croque-monsieur) | $4.56 | 615 | 38 g | 2 g | 1,503 mg |\n| [Shrimp scampi linguine](../#/recipe/shrimp-scampi) | $6.43 | 709 | 43 g | 3 g | 984 mg |", {"type": "stack", "layers": ["Dark roux · gumbo", "Brown roux · gravy", "Blond roux · velouté", "White roux · béchamel"]}], ["emulsions", "Emulsions", "An **emulsion** holds fat and water together. Starch (pasta water), egg yolk, mustard and blending all help.\n- Vinaigrette, mayonnaise, aioli, hollandaise, **carbonara**, cacio e pepe and **hummus** are all emulsions.\n- Keep it from getting too hot (eggs scramble, cheese clumps) and add fat slowly.\n- Broken? Start again with a spoon of water or a fresh yolk and whisk the broken sauce in slowly.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Spaghetti carbonara](../#/recipe/carbonara) | $5.59 | 956 | 44 g | 4 g | 1,551 mg |\n| [Cacio e pepe](../#/recipe/cacio-e-pepe) | $3.85 | 666 | 37 g | 4 g | 994 mg |\n| [Silky hummus](../#/recipe/hummus) | $1.03 | 303 | 9 g | 5 g | 379 mg |\n| [Caesar salad with homemade croutons](../#/recipe/caesar-salad) | $1.95 | 390 | 8 g | 4 g | 457 mg |", {"type": "emulsion"}], ["world-sauces", "Tomato sauces and the world's cold sauces", "**Tomato sauces**: quick (garlic and tomato, 20 minutes, like arrabbiata) or long-simmered (ragù, 3 hours). A pinch of sugar or a knob of butter balances acidic tomatoes.\n| Cold sauce | From |\n| Salsa, pico de gallo | Mexico |\n| Chimichurri; vinagrete | Argentina; Brazil |\n| Pesto | Italy |\n| Tzatziki; raita | Greece; India |\n| Nước chấm | Vietnam |\n| Green chutney; zhoug; mojo | India; Yemen; Cuba |\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Penne all’arrabbiata](../#/recipe/arrabbiata) | $1.55 | 678 | 19 g | 9 g | 773 mg |\n| [Pasta with basil pesto](../#/recipe/pesto-pasta) | $5.22 | 860 | 22 g | 4 g | 511 mg |\n| [Tzatziki](../#/recipe/tzatziki) | $1.10 | 92 | 9 g | 0 g | 120 mg |", {"type": "hub", "center": "Cold sauces", "spokes": ["Salsa", "Chimichurri", "Pesto", "Tzatziki", "Nước chấm", "Chutney", "Zhoug"]}]]}, {"t": "Mother techniques: heat methods", "s": [["braise", "Braising", "1. Season and **sear** the meat in batches until deeply brown.\n2. Soften aromatics in the same pot.\n3. **Deglaze**, add liquid partway up the meat.\n4. Cover; low simmer or 150–165°C (300–325°F) oven until fork-tender.\n5. Skim the fat, reduce, adjust seasoning.\nEvery cuisine braises: bourguignon, ragù, adobo, red-braised pork, tagine, birria, rendang, stifado, pot roast. Braises taste better the next day.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Bœuf bourguignon](../#/recipe/bourguignon) | $8.50 | 699 | 49 g | 2 g | 963 mg |\n| [Tagliatelle al ragù (bolognese)](../#/recipe/bolognese) | $3.53 | 767 | 36 g | 5 g | 665 mg |\n| [Maafe (peanut stew)](../#/recipe/maafe) | $3.00 | 435 | 33 g | 6 g | 853 mg |", {"type": "flow", "steps": ["Sear", "Aromatics", "Deglaze", "Low + slow", "Reduce"]}], ["roast-grill", "Roasting and grilling", "- **Roasting**: high heat (200–230°C) for vegetables and small cuts; moderate (165–175°C) for big roasts. Space things out; don't stir too often.\n- **Grilling and broiling**: direct heat for char. **Marinades** with acid (citrus, yogurt) and fruit enzymes (pear, pineapple) tenderise, but too long turns meat mushy.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Lemon herb roast chicken, with a big green salad](../#/recipe/roast-chicken) | $9.65 | 1396 | 79 g | 10 g | 1,533 mg |\n| [Oven chicken shawarma with garlic sauce](../#/recipe/shawarma) | $5.81 | 671 | 59 g | 5 g | 952 mg |\n| [Chicken souvlaki](../#/recipe/souvlaki) | $4.45 | 586 | 51 g | 3 g | 788 mg |\n| [Beef suya skewers](../#/recipe/suya) | $5.00 | 433 | 40 g | 3 g | 396 mg |\n| [Beef bulgogi](../#/recipe/bulgogi) | $5.96 | 666 | 41 g | 3 g | 1,003 mg |", {"type": "split", "lt": "Roast", "rt": "Grill", "left": ["Hot dry air", "Space on the pan", "Big cuts: moderate", "Veg: very hot"], "right": ["Direct flame", "Marinate first", "Char, not burn", "Rest after"]}], ["fry", "Sauté, stir-fry and fry", "| Method | How |\n| **Sauté** | A little fat, medium-high, food moved often |\n| **Stir-fry** | Very high heat, small pieces, constant motion; prep everything first; cook in batches |\n| **Pan-fry** | Fat partway up the food; flip once |\n| **Deep-fry** | Submerged at 175–190°C (350–375°F), small batches, thermometer, lid nearby |\n- **Breading**: flour → beaten egg → crumbs (panko for crunch). Rest 10 minutes so it sticks.\n- **Velveting**: coat meat in cornstarch and a little soy before stir-frying for a silky texture.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Chicken and vegetable stir-fry with rice](../#/recipe/stir-fry) | $5.14 | 765 | 36 g | 8 g | 1,471 mg |\n| [Kung pao chicken](../#/recipe/kung-pao) | $4.52 | 685 | 56 g | 5 g | 1,291 mg |\n| [Egg fried rice](../#/recipe/egg-fried-rice) | $1.58 | 594 | 18 g | 3 g | 807 mg |\n| [Tonkatsu](../#/recipe/tonkatsu) | $3.57 | 942 | 53 g | 5 g | 1,166 mg |", {"type": "flow", "steps": ["Prep all|mise en place", "Wok smoking", "Protein|batch 1", "Veg|batch 2", "Sauce|1 minute", "Serve now"]}]]}, {"t": "Mother techniques: dough, grains, beans and ferments", "s": [["dough", "Doughs, batters and baking", "Baking is chemistry: weigh, follow the method, change one thing at a time.\n| Family | Key move | In the app |\n| **Yeast doughs** | Knead for gluten, rise, shape, rise, bake hot | Pizza |\n| **Quick breads** | Wet into dry, stir just until combined | Banana bread |\n| **Creamed batters** | Beat butter and sugar until fluffy | Cookies |\n| **Pastry** | Cold fat cut into flour, minimal handling | Quiche, apple crisp |\n| **Thin batters** | Rest the batter | Crêpes, pancakes |\n| **Laminated / unleavened** | Roll, fold, roll | Scallion pancakes, dumplings |\n- **Baking soda** needs an acid (buttermilk, yogurt). **Baking powder** has its own. **Yeast** is alive and dies above about 60°C (140°F).\n- Raw flour can carry E. coli: don't eat raw dough unless the flour is heat-treated.", {"type": "split3", "cols": [["Yeast", "Pizza", "Bread", "Buns"], ["Chemical", "Pancakes", "Muffins", "Cookies"], ["Fat-layered", "Pie crust", "Phyllo", "Scallion pancakes"]]}], ["eggs-grains", "Eggs and grains", "| Eggs | How |\n| **Scrambled** | Medium-low, constant folding, pull while glossy |\n| **Boiled** | Into boiling water: 6–7 min jammy, 10–12 min hard; ice bath |\n| **Poached** | Fresh eggs, barely simmering water, 3–4 min (or in sauce: shakshuka) |\n| **Custard** | Low heat; **temper** hot liquid into eggs slowly |\n**Rice**: rinse until clearer (except risotto and paella, which want the starch). **Toast** grains in fat first for pilafs, arroz rojo and jollof.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Shakshuka](../#/recipe/shakshuka) | $4.11 | 604 | 28 g | 10 g | 1,421 mg |\n| [Mushroom risotto](../#/recipe/risotto) | $4.86 | 679 | 18 g | 3 g | 1,500 mg |\n| [Jollof rice](../#/recipe/jollof) | $1.69 | 420 | 7 g | 4 g | 546 mg |\n| [Chicken biryani](../#/recipe/biryani) | $3.27 | 526 | 37 g | 3 g | 567 mg |", {"type": "timeline", "items": [["3 min", "poached"], ["6 min", "jammy"], ["8 min", "soft-hard"], ["10 min", "hard"], ["12 min", "very hard"]]}], ["legumes", "Beans and lentils", "- **Lentils** need no soaking: red in 15–20 min, green or brown in 25–30.\n- **Dried beans**: soak overnight, drain, simmer 1–2 hours. **Red kidney beans**: boil hard at least 10 minutes first [@hc_lectins].\n- Salt beans when nearly tender; add acid (tomato, vinegar) late, because acid stops them softening.\n- Beans + grains = **complete protein**.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Dal tadka](../#/recipe/dal-tadka) | $0.76 | 243 | 13 g | 6 g | 320 mg |\n| [Silky hummus](../#/recipe/hummus) | $1.03 | 303 | 9 g | 5 g | 379 mg |\n| [Black bean burgers](../#/recipe/bean-burgers) | $2.02 | 501 | 18 g | 14 g | 708 mg |\n| [Gigantes plaki](../#/recipe/gigantes) | $1.84 | 326 | 14 g | 13 g | 942 mg |", {"type": "flow", "steps": ["Soak|5 h+", "Drain", "Hard boil|10 min", "Simmer|1–2 h", "Salt late"]}], ["ferment", "Pickling, fermenting and preserving", "Before fridges, every cuisine preserved food with salt, acid, sugar, smoke or fermentation. Those flavours (kimchi, miso, sauerkraut, fish sauce, yogurt, cheese) are now the backbone of world cooking.\n| Method | How |\n| **Quick pickle** | Hot vinegar, water, sugar and salt over vegetables; ready in 30 min; fridge 2 weeks |\n| **Salting** | Draws water out for crunch (oi muchim, tzatziki) |\n| **Lacto-fermentation** | Vegetables in 2–3% salt brine at room temperature for days; keep them under the brine |\n| **Curing** | Salt and time on meat or fish; tested recipes only |\n- Fuzzy mould, rot smell or slime: throw it out.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Lemongrass chicken bánh mì](../#/recipe/banh-mi) | $4.91 | 679 | 38 g | 5 g | 1,497 mg |\n| [Spicy cucumber salad (oi muchim)](../#/recipe/oi-muchim) | $1.09 | 50 | 2 g | 1 g | 346 mg |\n| [Kimchi jjigae](../#/recipe/kimchi-jjigae) | $3.62 | 589 | 21 g | 4 g | 564 mg |", {"type": "timeline", "items": [["30 min", "quick pickle"], ["1 day", "salted cucumber"], ["3–7 days", "kimchi"], ["2–4 weeks", "sauerkraut"], ["months", "miso"]]}]]}, {"t": "The world atlas: how to learn any cuisine", "s": [["atlas-how", "Four layers of every cuisine", "There are thousands of cuisines, but you don't learn them dish by dish. You learn each in four layers, and every chapter of this atlas follows them:\n1. The **flavour base**: the aromatics most dishes start with (soffritto, mirepoix, the holy trinity, ginger-garlic-scallion).\n2. The **pantry**: the 10–20 ingredients that make food taste of that place.\n3. The **techniques**: how heat is applied there (wok, tandoor, braise, grill, steam, ferment).\n4. The **dishes**: everyday home food first, celebration food later.\n- Buy a cuisine's pantry once and you can cook dozens of its dishes for the price of the fresh ingredients.\n- A good pace: one cuisine a month, three home dishes and one celebration dish.", {"type": "stack", "layers": ["Dishes", "Techniques", "Pantry", "Flavour base"]}], ["atlas-healthy", "Eating healthily across the world", "Almost every traditional cuisine eats well by default: lots of vegetables, legumes and grains, with small amounts of meat. The dishes hardest on health are usually festival or restaurant food: deep-fried, cream-heavy or very salty.\n- Cook the **everyday** food often and the **feast** food sometimes.\n- Watch **sodium** in fermented and soy-based cuisines; watch **saturated fat** in butter-, cream- and palm-oil-heavy ones.\n- Every region page lists the ingredients that are dangerous if done wrong.", {"type": "hub", "center": "The world's kitchens", "spokes": ["Europe", "Middle East", "Africa", "South Asia", "East Asia", "Southeast Asia", "The Americas", "Oceania"]}]]}, {"t": "Italy", "s": [["italy", "Italy: overview", "Italian cooking is regional (there is no single “Italian food”) and built on a simple idea: buy the best ingredients you can and do as little to them as needed. Pasta shape matches sauce, and sauce is a coating, not a soup.\n## Flavour base\nSoffritto (onion, carrot, celery in olive oil), or garlic and olive oil in the south.\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Penne all’arrabbiata](../#/recipe/arrabbiata) | $1.55 | 678 | 19 g | 9 g | 773 mg |\n| [Cacio e pepe](../#/recipe/cacio-e-pepe) | $3.85 | 666 | 37 g | 4 g | 994 mg |\n| [Spaghetti carbonara](../#/recipe/carbonara) | $5.59 | 956 | 44 g | 4 g | 1,551 mg |\n| [Pasta with basil pesto](../#/recipe/pesto-pasta) | $5.22 | 860 | 22 g | 4 g | 511 mg |\n| [Minestrone](../#/recipe/minestrone) | $2.28 | 272 | 12 g | 8 g | 1,219 mg |\n| [Mushroom risotto](../#/recipe/risotto) | $4.86 | 679 | 18 g | 3 g | 1,500 mg |\n| [Tagliatelle al ragù (bolognese)](../#/recipe/bolognese) | $3.53 | 767 | 36 g | 5 g | 665 mg |\n| [Eggplant parmigiana](../#/recipe/eggplant-parm) | $3.46 | 574 | 28 g | 9 g | 1,302 mg |\n| [Pizza margherita](../#/recipe/pizza) | $2.92 | 808 | 35 g | 5 g | 1,180 mg |\n| [Tiramisu](../#/recipe/tiramisu) | $1.91 | 393 | 5 g | 1 g | 68 mg |", {"type": "hub", "center": "Italy", "spokes": ["extra-virgin", "canned San", "parmigiano and", "dried pasta", "arborio or", "anchovies", "capers", "basil"]}], ["k-italy", "Italy: pantry, techniques, dishes", "**Flavour base**: Soffritto (onion, carrot, celery in olive oil), or garlic and olive oil in the south.\n\n**Pantry**: extra-virgin olive oil, canned San Marzano-style tomatoes, parmigiano and pecorino, dried pasta, arborio or carnaroli rice, anchovies, capers, basil, oregano, chili flakes, guanciale or pancetta, white beans.\n## Techniques\n- Salting pasta water and finishing pasta in the sauce with its cooking water\n- Risotto (toast, add hot stock gradually, finish off heat with butter and cheese)\n- Long-simmered ragù\n- Fresh egg pasta\n- Pizza at maximum oven heat\n## Dishes to master, easiest first\n1. **Aglio e olio**, arrabbiata\n2. **Cacio e pepe**, carbonara (sauce made off the heat)\n3. **Minestrone**, pasta e fagioli\n4. **Risotto**\n5. **Ragù bolognese**, lasagne\n6. **Fresh pasta**, gnocchi\n7. **Osso buco**, saltimbocca\n8. **Pizza**, focaccia\n9. **Tiramisu**, panna cotta\n> ⚠️ Carbonara uses raw egg cooked only by the pasta’s heat: keep it moving off the heat and serve at once; the Health tab flags it in pregnancy.\n> 💡 Everyday Italian is Mediterranean diet territory: olive oil, beans, vegetables, a small portion of pasta. Watch the cheese and cured meat for salt and saturated fat.", {"type": "flow", "steps": ["Aglio e olio", "Cacio e pepe", "Minestrone", "Risotto", "Ragù bolognese", "Fresh pasta", "Osso buco", "Pizza"]}]]}, {"t": "France", "s": [["france", "France: overview", "Professional kitchens worldwide still run on French technique and vocabulary: mise en place, mirepoix, roux, the mother sauces. Home French cooking is simpler: bistro braises, tarts, salads and good bread.\n## Flavour base\nMirepoix (onion, carrot, celery), shallots, butter, wine, thyme and bay (bouquet garni).\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Crêpes](../#/recipe/crepes) | $0.81 | 280 | 9 g | 1 g | 128 mg |\n| [Croque monsieur](../#/recipe/croque-monsieur) | $4.56 | 615 | 38 g | 2 g | 1,503 mg |\n| [Quiche lorraine](../#/recipe/quiche) | $2.34 | 504 | 16 g | 1 g | 641 mg |\n| [Salade niçoise](../#/recipe/nicoise) | $4.99 | 651 | 36 g | 14 g | 978 mg |\n| [Moules marinières](../#/recipe/moules) | $8.33 | 848 | 43 g | 4 g | 1,489 mg |\n| [Ratatouille](../#/recipe/ratatouille) | $2.04 | 211 | 5 g | 7 g | 428 mg |\n| [French onion soup](../#/recipe/french-onion) | $5.58 | 593 | 26 g | 4 g | 1,796 mg |\n| [Bœuf bourguignon](../#/recipe/bourguignon) | $8.50 | 699 | 49 g | 2 g | 963 mg |", {"type": "hub", "center": "France", "spokes": ["butter and cream", "shallots", "dijon mustard", "red and white", "wine vinegar", "herbes de", "tarragon", "chervil"]}], ["k-france", "France: pantry, techniques, dishes", "**Flavour base**: Mirepoix (onion, carrot, celery), shallots, butter, wine, thyme and bay (bouquet garni).\n\n**Pantry**: butter and cream, shallots, dijon mustard, red and white wine, wine vinegar, herbes de Provence, tarragon, chervil, chives, gruyère and comté, lardons, good bread.\n## Techniques\n- Mother sauces (béchamel, velouté, espagnole, tomato, hollandaise)\n- Pan sauces finished with butter\n- Braising in wine\n- Confit (slow cooking in fat)\n- Custards and pastry\n- Emulsions (mayonnaise, vinaigrette)\n## Dishes to master, easiest first\n1. **Vinaigrette**, omelette, crêpes\n2. **Croque monsieur**, quiche\n3. **Salade niçoise**, moules marinières\n4. **Ratatouille**, French onion soup\n5. **Steak frites with a pan sauce**\n6. **Coq au vin**, bœuf bourguignon\n7. **Hollandaise**, béarnaise\n8. **Tarte tatin**, crème brûlée, choux pastry\n> ⚠️ Mussels: discard any that stay open when tapped before cooking, or stay closed after. Flambéing: pull the pan off the heat before adding alcohol, and keep your face back.\n> 💡 Rich classics are high in butter and cream. Provençal cooking (olive oil, vegetables, fish) is the lighter side; ratatouille and niçoise are everyday healthy French.", {"type": "flow", "steps": ["Vinaigrette", "Croque monsieur", "Salade niçoise", "Ratatouille", "Steak frites with a", "Coq au vin", "Hollandaise", "Tarte tatin"]}]]}, {"t": "Spain and Portugal", "s": [["iberia", "Spain and Portugal: overview", "Iberian food is built on olive oil, garlic, paprika and the sea. Tapas (Spain) and petiscos (Portugal) teach you to cook many small, intensely flavoured things.\n| Kitchen | Flavour base |\n| **Spain** | Sofrito (onion, garlic, tomato, pepper slowly cooked in olive oil). |\n| **Portugal** | Onion, garlic, olive oil, bay, piri-piri chili. |\n## Practise the techniques in the app\nNo dishes from here in the app yet; these use the same techniques.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Shrimp scampi linguine](../#/recipe/shrimp-scampi) | $6.43 | 709 | 43 g | 3 g | 984 mg |\n| [Greek lemon potatoes](../#/recipe/lemon-potatoes) | $1.42 | 352 | 5 g | 6 g | 358 mg |", {"type": "hub", "center": "Spain and Portugal", "spokes": ["Spain", "Portugal"]}], ["k-spain", "Spain", "**Flavour base**: Sofrito (onion, garlic, tomato, pepper slowly cooked in olive oil).\n\n**Pantry**: olive oil, pimentón (sweet, hot and smoked paprika), saffron, sherry vinegar, bomba rice, chorizo and jamón, piquillo peppers, manchego, almonds.\n## Techniques\n- Paella (rice cooked in a wide pan, not stirred, forming a socarrat crust)\n- Slow-poaching potatoes in oil for tortilla\n- Gambas al ajillo (shrimp sizzled in garlic oil)\n- Cold soups blended with bread and oil\n## Dishes to master, easiest first\n1. **Pan con tomate**\n2. **Gambas al ajillo**\n3. **Patatas bravas**\n4. **Tortilla española**\n5. **Gazpacho and salmorejo**\n6. **Paella valenciana or de marisco**\n7. **Fabada**, cocido\n8. **Churros**, crema catalana\n> 💡 Gazpacho, legume stews and grilled fish are very healthy everyday Spain. Cured meats and cheese are the salty part.", {"type": "flow", "steps": ["Pan con tomate", "Gambas al ajillo", "Patatas bravas", "Tortilla española", "Gazpacho and salmorejo", "Paella valenciana or", "Fabada", "Churros"]}], ["k-portugal", "Portugal", "**Flavour base**: Onion, garlic, olive oil, bay, piri-piri chili.\n\n**Pantry**: bacalhau (salt cod), piri-piri, chouriço, sardines, olive oil, kale, potatoes, cinnamon.\n## Techniques\n- Desalting salt cod (soak 24–48 hours, changing the water)\n- Grilling sardines\n- Piri-piri marinades\n- Custard tarts\n## Dishes to master, easiest first\n1. **Caldo verde** (kale and potato soup)\n2. **Grilled sardines**\n3. **Piri-piri chicken**\n4. **Bacalhau à Brás**\n5. **Cataplana** (seafood stew)\n6. **Pastéis de nata**\n> ⚠️ Salt cod is extremely salty until properly soaked; taste a flake before cooking.", {"type": "flow", "steps": ["Caldo verde", "Grilled sardines", "Piri-piri chicken", "Bacalhau à Brás", "Cataplana", "Pastéis de nata"]}]]}, {"t": "Greece, Turkey and the Balkans", "s": [["greece-turkey", "Greece, Turkey and the Balkans: overview", "From Greece through Turkey to the Balkans, cooks share a pantry of olive oil, lemon, yogurt, herbs and pastry, and a love of grilling and slow-baked vegetables (ladera: vegetables cooked in olive oil).\n| Kitchen | Flavour base |\n| **Greece** | Olive oil, lemon, garlic, oregano, dill. |\n| **Turkey** | Onion, garlic, tomato and pepper paste (biber salçası), butter or olive oil. |\n| **The Balkans** | Onion, peppers, paprika, garlic, lard or sunflower oil. |\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Greek salad (horiatiki)](../#/recipe/horiatiki) | $3.45 | 343 | 9 g | 4 g | 868 mg |\n| [Tzatziki](../#/recipe/tzatziki) | $1.10 | 92 | 9 g | 0 g | 120 mg |\n| [Chicken souvlaki](../#/recipe/souvlaki) | $4.45 | 586 | 51 g | 3 g | 788 mg |\n| [Avgolemono soup](../#/recipe/avgolemono) | $3.09 | 257 | 31 g | 1 g | 1,302 mg |\n| [Gigantes plaki](../#/recipe/gigantes) | $1.84 | 326 | 14 g | 13 g | 942 mg |\n| [Greek lemon potatoes](../#/recipe/lemon-potatoes) | $1.42 | 352 | 5 g | 6 g | 358 mg |\n| [Spanakopita](../#/recipe/spanakopita) | $3.66 | 363 | 13 g | 4 g | 596 mg |", {"type": "hub", "center": "Greece, Turkey and the Balkans", "spokes": ["Greece", "Turkey", "The Balkans"]}], ["k-greece", "Greece", "**Flavour base**: Olive oil, lemon, garlic, oregano, dill.\n\n**Pantry**: olive oil, lemons, feta, Greek yogurt, dried oregano, dill and mint, kalamata olives, phyllo, giant beans, orzo.\n## Techniques\n- Lemon-oregano marinades\n- Tempering eggs into broth (avgolemono)\n- Phyllo pies\n- Oven-baked beans and vegetables in tomato and oil\n## Dishes to master, easiest first\n1. **Greek salad**, tzatziki\n2. **Souvlaki**\n3. **Avgolemono**\n4. **Gigantes plaki**, lemon potatoes\n5. **Spanakopita**\n6. **Moussaka**, pastitsio\n7. **Baklava**", {"type": "flow", "steps": ["Greek salad", "Souvlaki", "Avgolemono", "Gigantes plaki", "Spanakopita", "Moussaka", "Baklava"]}], ["k-turkey", "Turkey", "**Flavour base**: Onion, garlic, tomato and pepper paste (biber salçası), butter or olive oil.\n\n**Pantry**: pepper paste, Aleppo/pul biber and urfa chili, sumac, yogurt, bulgur, red lentils, pomegranate molasses, pistachios, phyllo and yufka.\n## Techniques\n- Kebabs on the grill\n- Yogurt sauces with browned chili butter\n- Stuffed vegetables (dolma)\n- Flatbreads\n## Dishes to master, easiest first\n1. **Mercimek çorbası** (red lentil soup)\n2. **Menemen** (eggs with peppers and tomato)\n3. **Çoban salatası**\n4. **Köfte and adana kebab**\n5. **İmam bayıldı**\n6. **Lahmacun**, pide\n7. **Mantı** (dumplings with yogurt)\n8. **Baklava**, künefe", {"type": "flow", "steps": ["Mercimek çorbası", "Menemen", "Çoban salatası", "Köfte and adana kebab", "İmam bayıldı", "Lahmacun", "Mantı", "Baklava"]}], ["k-the-balkans", "The Balkans", "**Flavour base**: Onion, peppers, paprika, garlic, lard or sunflower oil.\n\n**Pantry**: roasted red peppers, sour cream and white cheese, paprika, sauerkraut, phyllo.\n## Techniques\n- Roasting and peeling peppers\n- Grilled minced-meat sausages\n- Burek pastry\n## Dishes to master, easiest first\n1. **Ajvar** (roasted pepper relish)\n2. **Shopska salad**\n3. **Ćevapi**\n4. **Burek**\n5. **Sarma** (cabbage rolls)", {"type": "flow", "steps": ["Ajvar", "Shopska salad", "Ćevapi", "Burek", "Sarma"]}]]}, {"t": "British Isles, Central and Northern Europe", "s": [["north-europe", "British Isles, Central and Northern Europe: overview", "Cold-climate cooking is about preserving (smoking, curing, pickling, fermenting), roasting and baking, and making root vegetables, cabbage, grains and dairy delicious.\n| Kitchen | Flavour base |\n| **Britain and Ireland** | Onion, butter, thyme, bay, black pepper. |\n| **Germany, Austria and Switzerland** | Onion, butter or lard, caraway, mustard. |\n| **The Nordics** | Dill, butter, onion, allspice. |\n## Practise the techniques in the app\nNo dishes from here in the app yet; these use the same techniques.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Lemon herb roast chicken, with a big green salad](../#/recipe/roast-chicken) | $9.65 | 1396 | 79 g | 10 g | 1,533 mg |\n| [Chicken noodle soup](../#/recipe/chicken-noodle) | $2.76 | 253 | 20 g | 2 g | 1,074 mg |\n| [Apple crisp](../#/recipe/apple-crisp) | $0.99 | 356 | 3 g | 5 g | 99 mg |\n| [Lentil shepherd’s pie](../#/recipe/lentil-shepherds) | $1.52 | 380 | 15 g | 10 g | 787 mg |", {"type": "hub", "center": "British Isles, Central and Northern Europe", "spokes": ["Britain + Ireland", "German-speaking", "The Nordics"]}], ["k-britain-and-ireland", "Britain and Ireland", "**Flavour base**: Onion, butter, thyme, bay, black pepper.\n\n**Pantry**: potatoes, root vegetables, cheddar, oats, mustard, Worcestershire sauce, malt vinegar, flour and suet.\n## Techniques\n- The Sunday roast with gravy from the pan juices\n- Pies and pastry\n- Fish and chips batter\n- Scones and baking\n## Dishes to master, easiest first\n1. **Porridge**, a full breakfast\n2. **Shepherd’s or cottage pie**\n3. **Irish stew**\n4. **Roast with Yorkshire puddings and gravy**\n5. **Fish and chips**\n6. **Scones**, crumble, sticky toffee pudding", {"type": "flow", "steps": ["Porridge", "Shepherd’s or cottage", "Irish stew", "Roast with Yorkshire", "Fish and chips", "Scones"]}], ["k-germany-austria-and-switzerland", "Germany, Austria and Switzerland", "**Flavour base**: Onion, butter or lard, caraway, mustard.\n\n**Pantry**: sauerkraut, mustards, rye and pretzel breads, caraway, juniper, paprika, quark, Swiss cheeses.\n## Techniques\n- Schnitzel (pounded, breaded, shallow-fried)\n- Braising with vinegar (sauerbraten)\n- Potato dumplings\n- Cheese fondue\n## Dishes to master, easiest first\n1. **Kartoffelsalat**\n2. **Bratwurst and sauerkraut**\n3. **Wiener schnitzel**\n4. **Spätzle and käsespätzle**\n5. **Rösti**\n6. **Goulash** (Austrian style)\n7. **Apfelstrudel**", {"type": "flow", "steps": ["Kartoffelsalat", "Bratwurst and", "Wiener schnitzel", "Spätzle and", "Rösti", "Goulash", "Apfelstrudel"]}], ["k-the-nordics", "The Nordics", "**Flavour base**: Dill, butter, onion, allspice.\n\n**Pantry**: rye, dill, cured and smoked fish, lingonberries, dairy (skyr, butter), root vegetables, cardamom.\n## Techniques\n- Curing fish with salt and sugar (gravlax)\n- Pickling herring\n- Open sandwiches\n- Cardamom baking\n## Dishes to master, easiest first\n1. **Smørrebrød** (open rye sandwiches)\n2. **Gravlax with mustard-dill sauce**\n3. **Swedish meatballs with lingonberry**\n4. **Salmon soup** (lohikeitto)\n5. **Cinnamon and cardamom buns**\n> ⚠️ Curing raw fish: use fish that is sold for raw eating or has been frozen to kill parasites.\n> 💡 Nordic eating is high in oily fish, whole-grain rye and berries, and often cited as one of the healthiest regional diets.", {"type": "flow", "steps": ["Smørrebrød", "Gravlax with", "Swedish meatballs with", "Salmon soup", "Cinnamon and cardamom"]}]]}, {"t": "Eastern Europe and the Caucasus", "s": [["east-europe", "Eastern Europe and the Caucasus: overview", "From Poland and Ukraine to Hungary and Georgia, this is soup-and-dumpling country, with sour flavours (fermented vegetables, sour cream) balancing hearty food.\n| Kitchen | Flavour base |\n| **Poland, Ukraine and Russia** | Onion, dill, butter, sour cream, bay. |\n| **Hungary** | Onion slowly cooked in lard or oil, then lots of paprika off the heat. |\n| **Georgia and Armenia** | Walnuts, garlic, coriander, fenugreek, fresh herbs. |\n## Practise the techniques in the app\nNo dishes from here in the app yet; these use the same techniques.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Pork and cabbage dumplings](../#/recipe/dumplings) | $2.78 | 623 | 28 g | 2 g | 1,195 mg |", {"type": "hub", "center": "Eastern Europe and the Caucasus", "spokes": ["Poland, Ukraine, Russia", "Hungary", "Georgia + Armenia"]}], ["k-poland-ukraine-and-russia", "Poland, Ukraine and Russia", "**Flavour base**: Onion, dill, butter, sour cream, bay.\n\n**Pantry**: beets, cabbage and sauerkraut, potatoes, buckwheat, dill, sour cream, farmer’s cheese, rye.\n## Techniques\n- Filled dumplings (pierogi, varenyky, pelmeni)\n- Beet soups\n- Stuffed cabbage\n- Fermenting vegetables\n## Dishes to master, easiest first\n1. **Buckwheat** (kasha) with mushrooms\n2. **Borscht**\n3. **Pierogi or varenyky**\n4. **Golabki** (cabbage rolls)\n5. **Bigos** (hunter’s stew)\n6. **Syrniki** (cheese pancakes)", {"type": "flow", "steps": ["Buckwheat", "Borscht", "Pierogi or varenyky", "Golabki", "Bigos", "Syrniki"]}], ["k-hungary", "Hungary", "**Flavour base**: Onion slowly cooked in lard or oil, then lots of paprika off the heat.\n\n**Pantry**: sweet and hot Hungarian paprika, peppers, caraway, sour cream.\n## Techniques\n- Adding paprika off the heat so it does not burn and turn bitter\n## Dishes to master, easiest first\n1. **Lecsó** (pepper and tomato stew)\n2. **Gulyás** (goulash soup)\n3. **Chicken paprikash with nokedli**", {"type": "flow", "steps": ["Lecsó", "Gulyás", "Chicke
