n paprikash with"]}], ["k-georgia-and-armenia", "Georgia and Armenia", "**Flavour base**: Walnuts, garlic, coriander, fenugreek, fresh herbs.\n\n**Pantry**: walnuts, khmeli suneli spice blend, pomegranate, tkemali (sour plum sauce), sulguni cheese, tarragon, cilantro, dill.\n## Techniques\n- Walnut sauces\n- Cheese breads\n- Pleated dumplings (khinkali)\n## Dishes to master, easiest first\n1. **Pkhali** (vegetable-walnut pâtés)\n2. **Lobio** (spiced beans)\n3. **Khachapuri**\n4. **Khinkali**\n5. **Chakhokhbili** (chicken in tomato and herbs)", {"type": "flow", "steps": ["Pkhali", "Lobio", "Khachapuri", "Khinkali", "Chakhokhbili"]}]]}, {"t": "The Levant, Arabia and Jewish kitchens", "s": [["levant", "The Levant, Arabia and Jewish kitchens: overview", "Lebanon, Syria, Palestine, Jordan and Israel share mezze culture: many small plates of dips, salads and pickles. The Gulf and Yemen add rice dishes with warm spice blends. Jewish cooking spans every region it travelled through.\n| Kitchen | Flavour base |\n| **The Levant** | Garlic, lemon, olive oil, parsley, mint; seven-spice (baharat). |\n| **Arabian Peninsula and Yemen** | Onion, garlic, loomi (dried lime), baharat, cardamom. |\n| **Jewish diaspora kitchens** | Varies: onion and schmaltz (Ashkenazi), olive oil and spices (Sephardi and Mizrahi). |\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Silky hummus](../#/recipe/hummus) | $1.03 | 303 | 9 g | 5 g | 379 mg |\n| [Tabbouleh](../#/recipe/tabbouleh) | $2.42 | 230 | 3 g | 4 g | 294 mg |\n| [Oven chicken shawarma with garlic sauce](../#/recipe/shawarma) | $5.81 | 671 | 59 g | 5 g | 952 mg |\n| [Shakshuka](../#/recipe/shakshuka) | $4.11 | 604 | 28 g | 10 g | 1,421 mg |", {"type": "hub", "center": "The Levant, Arabia and Jewish kitchens", "spokes": ["The Levant", "Arabia + Yemen", "Jewish kitchens"]}], ["k-the-levant", "The Levant", "**Flavour base**: Garlic, lemon, olive oil, parsley, mint; seven-spice (baharat).\n\n**Pantry**: tahini, chickpeas, bulgur, sumac, za’atar, pomegranate molasses, Aleppo pepper, labneh, pita, pickled turnips.\n## Techniques\n- Blending to an emulsion (hummus, toum)\n- Spice marinades and high-heat roasting\n- Fine herb chopping for tabbouleh\n- Frying falafel from soaked (not cooked) chickpeas\n## Dishes to master, easiest first\n1. **Hummus**, baba ghanoush\n2. **Tabbouleh**, fattoush\n3. **Shakshuka**\n4. **Falafel**\n5. **Chicken shawarma with toum**\n6. **Mujaddara** (lentils, rice, crispy onions)\n7. **Kibbeh**\n8. **Knafeh**", {"type": "flow", "steps": ["Hummus", "Tabbouleh", "Shakshuka", "Falafel", "Chicken shawarma with", "Mujaddara", "Kibbeh", "Knafeh"]}], ["k-arabian-peninsula-and-yemen", "Arabian Peninsula and Yemen", "**Flavour base**: Onion, garlic, loomi (dried lime), baharat, cardamom.\n\n**Pantry**: basmati, dried limes, cardamom, saffron, dates, hawaij (Yemeni spice), zhoug (green chili sauce).\n## Techniques\n- Cooking meat and rice together in spiced broth\n- Slow-cooking under ground or in sealed pots\n## Dishes to master, easiest first\n1. **Saluf bread with zhoug**\n2. **Shorbat adas** (lentil soup)\n3. **Kabsa or machboos**\n4. **Mandi**\n5. **Luqaimat** (honey dumplings)", {"type": "flow", "steps": ["Saluf bread with zhoug", "Shorbat adas", "Kabsa or machboos", "Mandi", "Luqaimat"]}], ["k-jewish-diaspora-kitchens", "Jewish diaspora kitchens", "**Flavour base**: Varies: onion and schmaltz (Ashkenazi), olive oil and spices (Sephardi and Mizrahi).\n\n**Pantry**: matzo meal, dill, horseradish, chicken stock, tahini, date syrup.\n## Techniques\n- Slow overnight Sabbath stews (cholent, hamin, dafina)\n- Braided enriched bread\n## Dishes to master, easiest first\n1. **Matzo ball soup**\n2. **Latkes**\n3. **Sabich**\n4. **Challah**\n5. **Brisket**\n6. **Cholent or hamin**\n> 💡 Kosher and halal diets: the Health tab flags pork and alcohol. Kosher kitchens also separate meat and dairy.", {"type": "flow", "steps": ["Matzo ball soup", "Latkes", "Sabich", "Challah", "Brisket", "Cholent or hamin"]}]]}, {"t": "Persia and Central Asia", "s": [["persia", "Persia and Central Asia: overview", "Iranian cooking is perfumed and balanced between sweet and sour (dried limes, pomegranate, barberries), with mountains of fresh herbs. Afghanistan and Central Asia cook rice pilafs in huge pots.\n| Kitchen | Flavour base |\n| **Iran** | Onion fried golden, turmeric, saffron. |\n| **Afghanistan, Uzbekistan and Central Asia** | Onion, carrot, cumin, lamb fat. |\n## Practise the techniques in the app\nNo dishes from here in the app yet; these use the same techniques.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Chicken biryani](../#/recipe/biryani) | $3.27 | 526 | 37 g | 3 g | 567 mg |", {"type": "hub", "center": "Persia and Central Asia", "spokes": ["Iran", "Central Asia"]}], ["k-iran", "Iran", "**Flavour base**: Onion fried golden, turmeric, saffron.\n\n**Pantry**: saffron, basmati, dried limes, barberries, pomegranate molasses, dried mint, advieh spice, walnuts, kashk (whey).\n## Techniques\n- Parboiled and steamed rice with a crispy crust (tahdig)\n- Blooming saffron in hot water\n- Khoresh (slow stews)\n## Dishes to master, easiest first\n1. **Mast-o-khiar** (yogurt and cucumber)\n2. **Kuku sabzi** (herb frittata)\n3. **Chelow with tahdig**\n4. **Ghormeh sabzi**\n5. **Fesenjan** (pomegranate-walnut stew)\n6. **Joojeh kabab**", {"type": "flow", "steps": ["Mast-o-khiar", "Kuku sabzi", "Chelow with tahdig", "Ghormeh sabzi", "Fesenjan", "Joojeh kabab"]}], ["k-afghanistan-uzbekistan-and-central-asia", "Afghanistan, Uzbekistan and Central Asia", "**Flavour base**: Onion, carrot, cumin, lamb fat.\n\n**Pantry**: rice, yellow carrots, cumin, chickpeas, raisins, yogurt, lamb.\n## Techniques\n- Plov in a heavy pot (meat, onion and carrot first, then rice steamed on top)\n- Steamed dumplings\n- Tandoor-style breads\n## Dishes to master, easiest first\n1. **Bolani** (stuffed flatbreads)\n2. **Kabuli pulao**\n3. **Plov**\n4. **Mantu and ashak** (dumplings)\n5. **Lagman** (pulled noodles)", {"type": "flow", "steps": ["Bolani", "Kabuli pulao", "Plov", "Mantu and ashak", "Lagman"]}]]}, {"t": "North Africa", "s": [["north-africa", "North Africa: overview", "Morocco, Algeria, Tunisia, Libya and Egypt cook with warm spices, slow braises, and a balance of savoury, sweet and sour.\n| Kitchen | Flavour base |\n| **Morocco, Algeria and Tunisia** | Onion, garlic, ginger, cumin, paprika, cinnamon, saffron; harissa in Tunisia. |\n| **Egypt** | Garlic, onion, cumin, coriander. |\n## Practise the techniques in the app\nNo dishes from here in the app yet; these use the same techniques.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Shakshuka](../#/recipe/shakshuka) | $4.11 | 604 | 28 g | 10 g | 1,421 mg |\n| [Chana masala](../#/recipe/chana-masala) | $1.63 | 301 | 12 g | 11 g | 757 mg |", {"type": "hub", "center": "North Africa", "spokes": ["The Maghreb", "Egypt"]}], ["k-morocco-algeria-and-tunisia", "Morocco, Algeria and Tunisia", "**Flavour base**: Onion, garlic, ginger, cumin, paprika, cinnamon, saffron; harissa in Tunisia.\n\n**Pantry**: ras el hanout, harissa, preserved lemons, green olives, couscous, chickpeas, dried apricots and dates, cilantro and parsley, almonds.\n## Techniques\n- Tagine (slow braise under a cone lid, low heat)\n- Steaming couscous\n- Charmoula marinades\n- Preserving lemons in salt\n## Dishes to master, easiest first\n1. **Zaalouk** (eggplant salad)\n2. **Harira** (lentil and chickpea soup)\n3. **Chicken tagine with preserved lemon and olives**\n4. **Couscous with seven vegetables**\n5. **Lamb tagine with prunes**\n6. **Pastilla**\n> ⚠️ A clay tagine cracks on direct high heat: use a heat diffuser and keep the flame low.", {"type": "flow", "steps": ["Zaalouk", "Harira", "Chicken tagine with", "Couscous with seven", "Lamb tagine with", "Pastilla"]}], ["k-egypt", "Egypt", "**Flavour base**: Garlic, onion, cumin, coriander.\n\n**Pantry**: fava beans, lentils, rice and vermicelli, tahini, dukkah.\n## Techniques\n- Slow-cooked beans\n- Crispy fried onions\n- Layered rice-lentil-pasta dishes\n## Dishes to master, easiest first\n1. **Ful medames**\n2. **Ta’ameya** (fava falafel)\n3. **Molokhia**\n4. **Koshari**\n> 💡 Ful and koshari are cheap, high-fibre, plant-protein meals; survival food at its finest.", {"type": "flow", "steps": ["Ful medames", "Ta’ameya", "Molokhia", "Koshari"]}]]}, {"t": "West Africa", "s": [["west-africa", "West Africa: overview", "Nigeria, Ghana, Senegal and their neighbours build food on a blended base of tomato, pepper and onion, plus deep flavour from crayfish, fermented seeds, smoked fish and palm oil. Starchy “swallows” (fufu, eba, banku) are eaten with soups and stews.\n## Flavour base\nBlended tomato, red bell pepper, scotch bonnet and onion, fried down in oil until it darkens and the oil rises.\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Jollof rice](../#/recipe/jollof) | $1.69 | 420 | 7 g | 4 g | 546 mg |\n| [Maafe (peanut stew)](../#/recipe/maafe) | $3.00 | 435 | 33 g | 6 g | 853 mg |\n| [Beef suya skewers](../#/recipe/suya) | $5.00 | 433 | 40 g | 3 g | 396 mg |", {"type": "hub", "center": "West Africa", "spokes": ["scotch bonnets", "tomato paste", "palm oil", "ground peanuts", "dried crayfish", "stock cubes", "yaji/suya spice", "plantains"]}], ["k-west-africa", "West Africa: pantry, techniques, dishes", "**Flavour base**: Blended tomato, red bell pepper, scotch bonnet and onion, fried down in oil until it darkens and the oil rises.\n\n**Pantry**: scotch bonnets, tomato paste, palm oil, ground peanuts and peanut butter, dried crayfish, stock cubes, yaji/suya spice, plantains, cassava and yam flours, black-eyed peas, egusi (melon seeds).\n## Techniques\n- Frying the pepper base down to remove the raw taste\n- Cooking rice in sauce (jollof)\n- Thickening stews with nut butter or ground seeds\n- Pounding starches\n- Dry rubs and grilling\n## Dishes to master, easiest first\n1. **Fried plantains** (dodo)\n2. **Akara** (black-eyed pea fritters)\n3. **Jollof rice**\n4. **Maafe** (peanut stew), groundnut soup\n5. **Suya**\n6. **Egusi soup with fufu or eba**\n7. **Thieboudienne** (Senegalese fish and rice)\n8. **Kelewele**, chin chin\n> ⚠️ Cassava (gari, fufu, raw roots) must be properly processed and cooked; never eat raw cassava. Scotch bonnets are very hot: wear gloves, and do not touch your eyes. Stock cubes are very high in sodium; use half and taste.\n> 💡 Bean, vegetable and peanut dishes are excellent plant protein. Palm oil is high in saturated fat; use it for flavour, with a neutral oil for the rest.", {"type": "flow", "steps": ["Fried plantains", "Akara", "Jollof rice", "Maafe", "Suya", "Egusi soup with fufu", "Thieboudienne", "Kelewele"]}]]}, {"t": "East and Southern Africa", "s": [["east-south-africa", "East and Southern Africa: overview", "Ethiopia and Eritrea have one of the world’s most distinctive cuisines: spiced stews (wat) served on sour fermented flatbread. The Swahili coast blends African, Arab and Indian cooking. Southern Africa grills (braai) and has a Cape Malay spice tradition.\n| Kitchen | Flavour base |\n| **Ethiopia and Eritrea** | Lots of red onion cooked slowly, often without oil first, then niter kibbeh (spiced butter) and berbere. |\n| **East Africa (Kenya, Tanzania, Uganda)** | Onion, tomato, garlic, ginger; coconut and spices on the coast. |\n| **South Africa** | Onion, garlic, curry spices (Cape Malay), chili. |\n## Practise the techniques in the app\nNo dishes from here in the app yet; these use the same techniques.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Dal tadka](../#/recipe/dal-tadka) | $0.76 | 243 | 13 g | 6 g | 320 mg |\n| [Chana masala](../#/recipe/chana-masala) | $1.63 | 301 | 12 g | 11 g | 757 mg |", {"type": "hub", "center": "East and Southern Africa", "spokes": ["Ethiopia + Eritrea", "East Africa", "South Africa"]}], ["k-ethiopia-and-eritrea", "Ethiopia and Eritrea", "**Flavour base**: Lots of red onion cooked slowly, often without oil first, then niter kibbeh (spiced butter) and berbere.\n\n**Pantry**: berbere, mitmita, niter kibbeh (or a spiced oil for vegan dishes), red lentils, split peas, teff flour, collard greens.\n## Techniques\n- Dry-cooking onions down to a jammy base\n- Fermenting teff batter for injera (2–4 days)\n## Dishes to master, easiest first\n1. **Misir wot** (red lentils)\n2. **Shiro** (chickpea flour stew)\n3. **Gomen** (collards)\n4. **Doro wat** (chicken with egg)\n5. **Injera**\n> 💡 Ethiopian fasting food is fully vegan: lentils, split peas and greens. Perfect healthy plant cooking.", {"type": "flow", "steps": ["Misir wot", "Shiro", "Gomen", "Doro wat", "Injera"]}], ["k-east-africa-kenya-tanzania-uganda", "East Africa (Kenya, Tanzania, Uganda)", "**Flavour base**: Onion, tomato, garlic, ginger; coconut and spices on the coast.\n\n**Pantry**: maize flour, coconut milk, cardamom, pilau masala, beans, kale (sukuma).\n## Techniques\n- Ugali (stiff maize porridge)\n- Pilau spiced rice\n- Nyama choma (grilled meat)\n## Dishes to master, easiest first\n1. **Sukuma wiki** (braised greens)\n2. **Ugali**\n3. **Pilau**\n4. **Coconut bean curry** (maharagwe)\n5. **Nyama choma**\n6. **Chapati**, mandazi", {"type": "flow", "steps": ["Sukuma wiki", "Ugali", "Pilau", "Coconut bean curry", "Nyama choma", "Chapati"]}], ["k-south-africa", "South Africa", "**Flavour base**: Onion, garlic, curry spices (Cape Malay), chili.\n\n**Pantry**: curry powder, apricot jam and chutney, boerewors spices (coriander), maize meal.\n## Techniques\n- Braai (wood-fire grilling)\n- Bobotie (spiced mince baked with an egg custard)\n## Dishes to master, easiest first\n1. **Chakalaka** (spicy vegetable relish)\n2. **Pap** (maize porridge)\n3. **Bunny chow**\n4. **Bobotie**\n5. **Braai: boerewors and sosaties**\n6. **Malva pudding**", {"type": "flow", "steps": ["Chakalaka", "Pap", "Bunny chow", "Bobotie", "Braai: boerewors and", "Malva pudding"]}]]}, {"t": "India and South Asia", "s": [["south-asia", "India and South Asia: overview", "India alone has dozens of distinct cuisines. The north cooks with wheat breads, dairy and tandoors; the south with rice, coconut, curry leaves and tamarind; the east with mustard oil and fish; the west with everything from Goan vinegar curries to Gujarati vegetarian thalis. Pakistan, Bangladesh, Sri Lanka and Nepal each add their own.\n| Kitchen | Flavour base |\n| **North India and Pakistan** | Onion browned slowly, ginger-garlic paste, tomato, then ground spices. |\n| **South India and Sri Lanka** | Mustard seeds, curry leaves, dried red chili and urad dal popped in coconut oil. |\n| **Bengal, Bangladesh and Nepal** | Mustard oil, panch phoron (five-spice), green chili; timur pepper and ginger in Nepal. |\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Dal tadka](../#/recipe/dal-tadka) | $0.76 | 243 | 13 g | 6 g | 320 mg |\n| [Chana masala](../#/recipe/chana-masala) | $1.63 | 301 | 12 g | 11 g | 757 mg |\n| [Aloo gobi](../#/recipe/aloo-gobi) | $1.81 | 249 | 6 g | 7 g | 330 mg |\n| [Palak paneer](../#/recipe/palak-paneer) | $3.42 | 342 | 17 g | 4 g | 284 mg |\n| [Butter chicken](../#/recipe/butter-chicken) | $3.63 | 501 | 38 g | 3 g | 824 mg |\n| [Chicken biryani](../#/recipe/biryani) | $3.27 | 526 | 37 g | 3 g | 567 mg |\n| [Masala chai](../#/recipe/chai) | $0.54 | 85 | 4 g | 0 g | 56 mg |\n> Indian vegetarian cooking is one of the best healthy diets on earth: dal, beans, vegetables, yogurt and whole-wheat breads. Restaurant curries are much richer than home food; go easy on cream and ghee.", {"type": "hub", "center": "India and South Asia", "spokes": ["North India + Pakistan", "South India + Sri Lanka", "Bengal + Nepal"]}], ["k-north-india-and-pakistan", "North India and Pakistan", "**Flavour base**: Onion browned slowly, ginger-garlic paste, tomato, then ground spices.\n\n**Pantry**: cumin seeds, coriander, turmeric, Kashmiri chili, garam masala, cardamom, cloves, bay, ghee, basmati, atta flour, lentils and chickpeas, paneer, yogurt, kasuri methi.\n## Techniques\n- Tadka/tempering (whole spices in hot fat poured over dal)\n- Bhuna (frying the masala until oil separates)\n- Yogurt marinades\n- Dum (sealed steaming for biryani)\n- Flatbreads on a tawa\n## Dishes to master, easiest first\n1. **Jeera rice**, raita, chapati\n2. **Dal tadka**, chana masala\n3. **Aloo gobi**, palak paneer\n4. **Rajma** (kidney bean curry)\n5. **Butter chicken**, karahi\n6. **Biryani**\n7. **Nihari**, haleem\n8. **Gulab jamun**, kheer\n> ⚠️ Rajma from dried kidney beans: soak and boil hard for 10 minutes first. Whole spices (cloves, cardamom, bay) are usually not eaten: warn guests or fish them out.", {"type": "flow", "steps": ["Jeera rice", "Dal tadka", "Aloo gobi", "Rajma", "Butter chicken", "Biryani", "Nihari", "Gulab jamun"]}], ["k-south-india-and-sri-lanka", "South India and Sri Lanka", "**Flavour base**: Mustard seeds, curry leaves, dried red chili and urad dal popped in coconut oil.\n\n**Pantry**: curry leaves, mustard seeds, coconut, tamarind, rice and urad dal, sambar powder, Sri Lankan roasted curry powder, Maldive fish.\n## Techniques\n- Fermented rice-lentil batters (dosa, idli)\n- Coconut-based curries\n- Tamarind sour gravies\n## Dishes to master, easiest first\n1. **Coconut chutney**, upma\n2. **Sambar**, rasam\n3. **Lemon rice**, curd rice\n4. **Dosa and idli**\n5. **Kerala fish curry**\n6. **Sri Lankan dhal and pol sambol**\n7. **Kottu roti**, hoppers", {"type": "flow", "steps": ["Coconut chutney", "Sambar", "Lemon rice", "Dosa and idli", "Kerala fish curry", "Sri Lankan dhal and", "Kottu roti"]}], ["k-bengal-bangladesh-and-nepal", "Bengal, Bangladesh and Nepal", "**Flavour base**: Mustard oil, panch phoron (five-spice), green chili; timur pepper and ginger in Nepal.\n\n**Pantry**: mustard oil and seeds, panch phoron, hilsa and other river fish, jaggery, timur, lentils.\n## Techniques\n- Heating mustard oil to its smoking point first to tame it\n- Steamed dumplings (momo)\n## Dishes to master, easiest first\n1. **Dal bhat** (lentils and rice)\n2. **Shorshe maach** (fish in mustard)\n3. **Momos with tomato achar**\n4. **Mishti doi**, rasgulla", {"type": "flow", "steps": ["Dal bhat", "Shorshe maach", "Momos with tomato", "Mishti doi"]}]]}, {"t": "China", "s": [["china", "China: overview", "China is a continent of cuisines. Cantonese is subtle and fresh; Sichuan is numbing and spicy; Hunan is hot and sour; Shandong and Beijing are wheat, noodles and roast duck; Jiangsu and Zhejiang are sweet, delicate and soy-braised; Fujian is soups and seafood. All share the wok, the cleaver and a respect for texture.\n## Flavour base\nGinger, garlic and scallion, sizzled in oil.\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Tomato and egg stir-fry](../#/recipe/tomato-egg) | $1.82 | 316 | 15 g | 2 g | 645 mg |\n| [Garlic bok choy](../#/recipe/bok-choy) | $1.35 | 84 | 3 g | 2 g | 395 mg |\n| [Egg fried rice](../#/recipe/egg-fried-rice) | $1.58 | 594 | 18 g | 3 g | 807 mg |\n| [Kung pao chicken](../#/recipe/kung-pao) | $4.52 | 685 | 56 g | 5 g | 1,291 mg |\n| [Mapo tofu](../#/recipe/mapo-tofu) | $2.30 | 314 | 21 g | 2 g | 1,103 mg |\n| [Scallion pancakes](../#/recipe/scallion-pancakes) | $0.59 | 359 | 7 g | 2 g | 515 mg |\n| [Pork and cabbage dumplings](../#/recipe/dumplings) | $2.78 | 623 | 28 g | 2 g | 1,195 mg |", {"type": "hub", "center": "China", "spokes": ["light and dark", "Shaoxing wine", "Chinkiang black", "oyster sauce", "toasted sesame", "cornstarch", "white pepper", "star anise"]}], ["k-china-everyday-home-cooking", "China (everyday home cooking): pantry, techniques, dishes", "**Flavour base**: Ginger, garlic and scallion, sizzled in oil.\n\n**Pantry**: light and dark soy sauce, Shaoxing wine, Chinkiang black vinegar, oyster sauce, toasted sesame oil, cornstarch, white pepper, star anise, dried chilies, Sichuan peppercorns, doubanjiang (chili bean paste), fermented black beans, jasmine rice, noodles.\n## Techniques\n- Stir-frying in batches over high heat\n- Velveting meat with cornstarch\n- Steaming fish and dumplings\n- Red-braising (soy, sugar, wine)\n- Balancing sweet, sour, salty, bitter and spicy in one sauce\n## Dishes to master, easiest first\n1. **Tomato and egg stir-fry**\n2. **Garlic greens**, egg fried rice\n3. **Kung pao chicken**, mapo tofu\n4. **Scallion pancakes**\n5. **Dumplings** (jiaozi)\n6. **Steamed whole fish with ginger and scallion**\n7. **Red-braised pork belly**\n8. **Dan dan noodles**, hand-pulled noodles\n9. **Peking-style roast duck**\n> ⚠️ Fried rice: always use rice that was cooled and refrigerated within an hour or two of cooking. Wok smoke and oil: open a window, use high-smoke-point oil, and keep the sesame oil for finishing. Soy sauce and doubanjiang contain wheat: use tamari and check labels for celiac.\n> 💡 Lots of vegetables and modest meat make everyday Chinese food balanced. The sauces are where sodium hides: measure soy sauce rather than pouring.", {"type": "flow", "steps": ["Tomato and egg", "Garlic greens", "Kung pao chicken", "Scallion pancakes", "Dumplings", "Steamed whole fish", "Red-braised pork belly", "Dan dan noodles"]}]]}, {"t": "Japan", "s": [["japan", "Japan: overview", "Japanese home cooking is built on dashi (seaweed and bonito stock), rice, and a few seasonings: soy, mirin, sake, miso. A traditional meal is “one soup, three sides” (ichijū sansai) with rice.\n## Flavour base\nDashi plus soy sauce, mirin and sake.\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Miso soup](../#/recipe/miso-soup) | $1.95 | 75 | 5 g | 1 g | 677 mg |\n| [Salmon onigiri](../#/recipe/onigiri) | $2.19 | 474 | 19 g | 2 g | 328 mg |\n| [Oyakodon](../#/recipe/oyakodon) | $2.94 | 521 | 37 g | 2 g | 1,184 mg |\n| [Gyudon (beef bowl)](../#/recipe/gyudon) | $3.58 | 592 | 26 g | 2 g | 1,053 mg |\n| [Chicken teriyaki](../#/recipe/teriyaki) | $4.83 | 715 | 43 g | 1 g | 1,785 mg |\n| [Yakisoba](../#/recipe/yakisoba) | $3.70 | 676 | 32 g | 7 g | 1,321 mg |\n| [Tonkatsu](../#/recipe/tonkatsu) | $3.57 | 942 | 53 g | 5 g | 1,166 mg |", {"type": "hub", "center": "Japan", "spokes": ["kombu", "bonito flakes", "white and red", "soy sauce", "mirin", "sake", "rice vinegar", "short-grain rice"]}], ["k-japan", "Japan: pantry, techniques, dishes", "**Flavour base**: Dashi plus soy sauce, mirin and sake.\n\n**Pantry**: kombu, bonito flakes, white and red miso, soy sauce, mirin, sake, rice vinegar, short-grain rice, nori, panko, tofu, katsuobushi, shichimi togarashi.\n## Techniques\n- Making dashi without boiling the kombu\n- Washing and steaming short-grain rice\n- Simmering in seasoned broth (nimono)\n- Glazing (teriyaki)\n- Shallow-frying breaded cutlets\n- Tempura batter (ice-cold, barely mixed)\n- Sushi rice seasoning and shaping\n## Dishes to master, easiest first\n1. **Miso soup**, rice, pickles\n2. **Onigiri**\n3. **Tamagoyaki** (rolled omelette)\n4. **Oyakodon**, gyudon\n5. **Chicken teriyaki**, yakisoba\n6. **Tonkatsu**, karaage\n7. **Ramen from scratch**\n8. **Tempura**\n9. **Sushi and sashimi**\n> ⚠️ Raw fish: buy fish sold for raw eating (often labelled sashimi-grade) from a trusted fishmonger, keep it very cold, eat it the same day. Kombu is very high in iodine; normal dashi is fine, but do not eat large amounts of seaweed daily.\n> 💡 Japanese home food is light on fat and rich in fish, soy and vegetables, but high in sodium from soy and miso. Use low-sodium soy and keep miso to a bowl a day if you watch blood pressure.", {"type": "flow", "steps": ["Miso soup", "Onigiri", "Tamagoyaki", "Oyakodon", "Chicken teriyaki", "Tonkatsu", "Ramen from scratch", "Tempura"]}]]}, {"t": "Korea", "s": [["korea", "Korea: overview", "Korean food is about fermentation (kimchi, gochujang, doenjang, soy), many small side dishes (banchan) shared around rice and soup, and the grill.\n## Flavour base\nGarlic, scallion, sesame oil and toasted sesame seeds; gochujang and doenjang.\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Spicy cucumber salad (oi muchim)](../#/recipe/oi-muchim) | $1.09 | 50 | 2 g | 1 g | 346 mg |\n| [Kimchi fried rice](../#/recipe/kimchi-fried-rice) | $3.28 | 692 | 21 g | 4 g | 1,344 mg |\n| [Bibimbap](../#/recipe/bibimbap) | $3.35 | 595 | 18 g | 6 g | 1,002 mg |\n| [Japchae](../#/recipe/japchae) | $2.64 | 383 | 5 g | 4 g | 708 mg |\n| [Beef bulgogi](../#/recipe/bulgogi) | $5.96 | 666 | 41 g | 3 g | 1,003 mg |\n| [Kimchi jjigae](../#/recipe/kimchi-jjigae) | $3.62 | 589 | 21 g | 4 g | 564 mg |", {"type": "hub", "center": "Korea", "spokes": ["gochujang", "gochugaru", "doenjang", "soy sauce", "toasted sesame", "kimchi", "rice", "sweet potato"]}], ["k-korea", "Korea: pantry, techniques, dishes", "**Flavour base**: Garlic, scallion, sesame oil and toasted sesame seeds; gochujang and doenjang.\n\n**Pantry**: gochujang, gochugaru (chili flakes), doenjang, soy sauce, toasted sesame oil and seeds, kimchi, rice, sweet potato glass noodles, Asian pear, tofu.\n## Techniques\n- Seasoning each vegetable separately (namul)\n- Fruit-based marinades that tenderise\n- Salting vegetables\n- Making kimchi (salt, paste, ferment)\n- Stews in a stone or clay pot (jjigae)\n## Dishes to master, easiest first\n1. **Oi muchim**, spinach namul\n2. **Gyeran-mari** (rolled omelette)\n3. **Kimchi fried rice**\n4. **Bibimbap**, japchae\n5. **Bulgogi**, dak-galbi\n6. **Kimchi jjigae**, sundubu jjigae\n7. **Tteokbokki**\n8. **Homemade kimchi**\n9. **Korean fried chicken**\n> ⚠️ Most gochujang contains wheat; check labels for celiac. Kimchi is very salty; it is a condiment, not a vegetable portion.\n> 💡 Banchan are mostly vegetables, and ferments bring flavour without much fat. Sodium is the thing to watch.", {"type": "flow", "steps": ["Oi muchim", "Gyeran-mari", "Kimchi fried rice", "Bibimbap", "Bulgogi", "Kimchi jjigae", "Tteokbokki", "Homemade kimchi"]}]]}, {"t": "Thailand, Laos, Cambodia and Myanmar", "s": [["thai-mekong", "Thailand, Laos, Cambodia and Myanmar: overview", "Mainland Southeast Asian cooking balances strong flavours: lime and tamarind for sour, palm sugar for sweet, fish sauce for salt, chilies for heat. Pastes are pounded in a mortar, herbs go in by the handful.\n| Kitchen | Flavour base |\n| **Thailand** | Pounded garlic, chili, shallot, lemongrass, galangal, cilantro root. |\n| **Laos, Cambodia and Myanmar** | Lemongrass, galangal, garlic and shallot pastes (kroeung in Cambodia), fermented fish. |\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Pad kra pao (holy basil chicken)](../#/recipe/kra-pao) | $5.50 | 626 | 37 g | 1 g | 922 mg |\n| [Larb gai (chicken larb)](../#/recipe/larb) | $5.37 | 319 | 31 g | 6 g | 1,056 mg |\n| [Tom yum goong](../#/recipe/tom-yum) | $6.52 | 155 | 27 g | 1 g | 2,120 mg |\n| [Thai green curry](../#/recipe/green-curry) | $4.86 | 591 | 31 g | 4 g | 920 mg |\n| [Pad thai](../#/recipe/pad-thai) | $6.52 | 870 | 43 g | 6 g | 2,073 mg |\n| [Mango sticky rice](../#/recipe/mango-sticky-rice) | $1.61 | 503 | 6 g | 3 g | 151 mg |", {"type": "hub", "center": "Thailand, Laos, Cambodia and Myanmar", "spokes": ["Thailand", "Laos, Cambodia, Myanmar"]}], ["k-thailand", "Thailand", "**Flavour base**: Pounded garlic, chili, shallot, lemongrass, galangal, cilantro root.\n\n**Pantry**: fish sauce, palm sugar, tamarind, limes, coconut milk, curry pastes, lemongrass, galangal, makrut lime leaves, Thai holy basil and Thai basil, jasmine and sticky rice, rice noodles, dried shrimp.\n## Techniques\n- Pounding pastes in a mortar\n- Cracking coconut cream and frying curry paste in it\n- Infusing broths with aromatics\n- Toasted rice powder\n- Tasting and balancing at the end\n## Dishes to master, easiest first\n1. **Pad kra pao with a fried egg**\n2. **Som tam** (green papaya salad)\n3. **Larb**\n4. **Tom yum**, tom kha\n5. **Green and red curry**\n6. **Pad thai**, pad see ew\n7. **Massaman curry**\n8. **Mango sticky rice**\n> ⚠️ Many curry pastes contain shrimp paste: not vegan, and a shellfish allergen. Fish sauce is very salty: add by the teaspoon and taste.", {"type": "flow", "steps": ["Pad kra pao with a", "Som tam", "Larb", "Tom yum", "Green and red curry", "Pad thai", "Massaman curry", "Mango sticky rice"]}], ["k-laos-cambodia-and-myanmar", "Laos, Cambodia and Myanmar", "**Flavour base**: Lemongrass, galangal, garlic and shallot pastes (kroeung in Cambodia), fermented fish.\n\n**Pantry**: sticky rice, padaek or prahok (fermented fish), kroeung paste, fresh herbs, chickpea flour (Myanmar).\n## Techniques\n- Steaming sticky rice in a basket\n- Fish steamed in banana leaf (amok)\n- Slow-fried onion and turmeric bases (Myanmar)\n## Dishes to master, easiest first\n1. **Larb** (the Lao original)\n2. **Fish amok**\n3. **Lok lak**\n4. **Mohinga** (fish noodle soup)\n5. **Tea leaf salad** (lahpet thoke)", {"type": "flow", "steps": ["Larb", "Fish amok", "Lok lak", "Mohinga", "Tea leaf salad"]}]]}, {"t": "Vietnam", "s": [["vietnam", "Vietnam: overview", "Vietnamese food is among the freshest in the world: plates of raw herbs and lettuce, bright dipping sauce, and long-simmered clear broths. The north is subtle, the centre spicy, the south sweeter.\n## Flavour base\nFish sauce, lime, sugar, garlic and chili (nước chấm); shallots fried crisp; lemongrass.\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Gỏi cuốn (fresh spring rolls)](../#/recipe/goi-cuon) | $5.43 | 379 | 26 g | 6 g | 690 mg |\n| [Lemongrass chicken bánh mì](../#/recipe/banh-mi) | $4.91 | 679 | 38 g | 5 g | 1,497 mg |\n| [Bún bò Nam Bộ (beef noodle salad)](../#/recipe/bun-bo) | $7.42 | 736 | 45 g | 8 g | 2,046 mg |\n| [Phở gà (chicken pho)](../#/recipe/pho-ga) | $7.33 | 588 | 54 g | 3 g | 2,400 mg |", {"type": "hub", "center": "Vietnam", "spokes": ["fish sauce", "rice paper", "rice vermicelli", "mint", "Thai basil", "cilantro", "perilla", "star anise"]}], ["k-vietnam", "Vietnam: pantry, techniques, dishes", "**Flavour base**: Fish sauce, lime, sugar, garlic and chili (nước chấm); shallots fried crisp; lemongrass.\n\n**Pantry**: fish sauce, rice paper, rice vermicelli and phở noodles, mint, Thai basil, cilantro, perilla, star anise, cinnamon, lemongrass, pickled carrot and daikon, baguettes.\n## Techniques\n- Charring onion and ginger for broth\n- Balancing nước chấm\n- Rolling rice paper\n- Quick pickling\n- Caramel sauce for braises (kho)\n## Dishes to master, easiest first\n1. **Gỏi cuốn** (fresh rolls)\n2. **Nước chấm and noodle salads** (bún)\n3. **Bánh mì**\n4. **Phở gà**, phở bò\n5. **Cá kho** (caramel fish)\n6. **Bún chả**\n7. **Bánh xèo** (crispy crêpes)\n> 💡 Herb- and vegetable-heavy and low in fat. Broth and fish sauce make phở very high in sodium; drink less of the broth if that matters for you.", {"type": "flow", "steps": ["Gỏi cuốn", "Nước chấm and noodle", "Bánh mì", "Phở gà", "Cá kho", "Bún chả", "Bánh xèo"]}]]}, {"t": "The Philippines, Indonesia, Malaysia and Singapore", "s": [["maritime-sea", "The Philippines, Indonesia, Malaysia and Singapore: overview", "Island Southeast Asia mixes Malay, Chinese, Indian, Spanish, Dutch and Arab influences. Expect spice pastes (rempah), coconut, sour soups, and sweet-salty soy.\n| Kitchen | Flavour base |\n| **The Philippines** | Garlic, onion, vinegar, soy, bay and black pepper. |\n| **Indonesia and Malaysia** | Rempah/bumbu: pounded shallot, garlic, chili, lemongrass, galangal, turmeric, candlenut, shrimp paste. |\n| **Singapore** | A crossroads of Chinese, Malay and Indian bases. |\n## Practise the techniques in the app\nNo dishes from here in the app yet; these use the same techniques.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Thai green curry](../#/recipe/green-curry) | $4.86 | 591 | 31 g | 4 g | 920 mg |\n| [Egg fried rice](../#/recipe/egg-fried-rice) | $1.58 | 594 | 18 g | 3 g | 807 mg |", {"type": "hub", "center": "The Philippines, Indonesia, Malaysia and Singapore", "spokes": ["The Philippines", "Indonesia + Malaysia", "Singapore"]}], ["k-the-philippines", "The Philippines", "**Flavour base**: Garlic, onion, vinegar, soy, bay and black pepper.\n\n**Pantry**: cane or coconut vinegar, soy sauce, calamansi, fish sauce (patis), shrimp paste (bagoong), tamarind, bay leaves, jasmine rice.\n## Techniques\n- Adobo (braising in vinegar and soy)\n- Sour tamarind soups\n- Garlic fried rice from leftovers\n## Dishes to master, easiest first\n1. **Sinangag** (garlic fried rice)\n2. **Chicken adobo**\n3. **Sinigang**\n4. **Pancit**\n5. **Lumpia**\n6. **Kare-kare**\n7. **Halo-halo**", {"type": "flow", "steps": ["Sinangag", "Chicken adobo", "Sinigang", "Pancit", "Lumpia", "Kare-kare", "Halo-halo"]}], ["k-indonesia-and-malaysia", "Indonesia and Malaysia", "**Flavour base**: Rempah/bumbu: pounded shallot, garlic, chili, lemongrass, galangal, turmeric, candlenut, shrimp paste.\n\n**Pantry**: kecap manis (sweet soy), sambal oelek, belacan/terasi, coconut milk, tamarind, peanuts, candlenuts, pandan, tempeh.\n## Techniques\n- Frying the spice paste until fragrant and the oil splits\n- Slow-reducing coconut braises until dry (rendang)\n- Satay grilling\n- Frying tempeh\n## Dishes to master, easiest first\n1. **Nasi goreng**\n2. **Gado-gado** (salad with peanut sauce)\n3. **Satay**\n4. **Mee goreng**\n5. **Laksa**\n6. **Beef rendang**\n7. **Nasi lemak**\n> ⚠️ Candlenuts are toxic raw; always cook them.\n> 💡 Tempeh is a fermented soy protein with lots of fibre: one of the best plant proteins in the world.", {"type": "flow", "steps": ["Nasi goreng", "Gado-gado", "Satay", "Mee goreng", "Laksa", "Beef rendang", "Nasi lemak"]}], ["k-singapore", "Singapore", "**Flavour base**: A crossroads of Chinese, Malay and Indian bases.\n\n**Pantry**: chili crab sauce ingredients, dark soy, ginger, pandan, kaya (coconut jam).\n## Techniques\n- Poached chicken with flavoured rice\n- Hawker-stall high-heat noodle frying\n## Dishes to master, easiest first\n1. **Kaya toast**\n2. **Hainanese chicken rice**\n3. **Char kway teow**\n4. **Chili crab**", {"type": "flow", "steps": ["Kaya toast", "Hainanese chicken rice", "Char kway teow", "Chili crab"]}]]}, {"t": "Mexico and Central America", "s": [["mexico", "Mexico and Central America: overview", "Mexican cooking is ancient and regional, built on corn (nixtamalised into masa), beans, squash and dozens of dried and fresh chilies. Salsas and moles are its sauces. Central America shares corn and beans with its own dishes.\n| Kitchen | Flavour base |\n| **Mexico** | Toasted dried chilies, charred tomato, onion and garlic, blended and fried. |\n| **Central America** | Onion, sweet pepper, garlic, cilantro (sofrito); achiote. |\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Guacamole and pico de gallo](../#/recipe/guac-pico) | $3.34 | 584 | 9 g | 13 g | 548 mg |\n| [Arroz rojo (Mexican red rice)](../#/recipe/arroz-rojo) | $0.95 | 268 | 5 g | 2 g | 550 mg |\n| [Chicken tinga tacos](../#/recipe/tinga) | $4.47 | 502 | 47 g | 8 g | 806 mg |\n| [Baja-style fish tacos](../#/recipe/fish-tacos) | $6.24 | 507 | 38 g | 8 g | 420 mg |\n| [Watermelon agua fresca](../#/recipe/agua-fresca) | $0.77 | 88 | 2 g | 1 g | 3 mg |\n| [Classic margarita](../#/recipe/margarita) | $3.99 | 219 | 0 g | 0 g | 108 mg |", {"type": "hub", "center": "Mexico and Central America", "spokes": ["Mexico", "Central America"]}], ["k-mexico", "Mexico", "**Flavour base**: Toasted dried chilies, charred tomato, onion and garlic, blended and fried.\n\n**Pantry**: dried ancho, guajillo, pasilla and chipotle chilies, fresh jalapeños and serranos, corn tortillas and masa harina, black and pinto beans, limes, cilantro, Mexican oregano, cumin, tomatillos, queso fresco and cotija, Mexican chocolate.\n## Techniques\n- Toasting and soaking dried chilies\n- Charring vegetables on a dry pan (comal)\n- Frying a blended salsa to deepen it\n- Toasting rice before cooking\n- Poaching and shredding meat\n- Pressing tortillas from masa\n## Dishes to master, easiest first\n1. **Pico de gallo**, guacamole\n2. **Frijoles de la olla**, refried beans\n3. **Arroz rojo**\n4. **Chicken tinga tacos**\n5. **Chilaquiles**, huevos rancheros\n6. **Pozole**\n7. **Tamales**\n8. **Birria**, cochinita pibil\n9. **Mole poblano**\n> ⚠️ Toast dried chilies only a few seconds per side: burnt chilies make a bitter sauce. Chipotles in adobo are hot; start with one.\n> 💡 Beans, corn tortillas, salsa and grilled protein are a balanced, high-fibre plate. The cheese, sour cream and frying are the extras.", {"type": "flow", "steps": ["Pico de gallo", "Frijoles de la olla", "Arroz rojo", "Chicken tinga tacos", "Chilaquiles", "Pozole", "Tamales", "Birria"]}], ["k-central-america", "Central America", "**Flavour base**: Onion, sweet pepper, garlic, cilantro (sofrito); achiote.\n\n**Pantry**: black and red beans, rice, corn masa, plantains, achiote, Lizano-style sauce.\n## Techniques\n- Rice and beans fried together\n- Stuffed masa cakes\n## Dishes to master, easiest first\n1. **Gallo pinto**\n2. **Pupusas with curtido** (El Salvador)\n3. **Baleadas** (Honduras)\n4. **Pepián** (Guatemala)", {"type": "flow", "steps": ["Gallo pinto", "Pupusas with curtido", "Baleadas", "Pepián"]}]]}, {"t": "The Caribbean", "s": [["caribbean", "The Caribbean: overview", "Caribbean food mixes Indigenous, African, European, Indian and Chinese traditions. Each island has its own accent: jerk and curry goat in Jamaica, sofrito and pernil in Puerto Rico, mojo in Cuba, epis in Haiti, roti and doubles in Trinidad.\n| Kitchen | Flavour base |\n| **Jamaica and the English-speaking islands** | Scallion, thyme, scotch bonnet, allspice (pimento), garlic. |\n| **Cuba, Puerto Rico, Dominican Republic and Haiti** | Sofrito/recaito (onion, pepper, garlic, culantro); mojo (citrus and garlic); epis (Haiti). |\n## Practise the techniques in the app\nNo dishes from here in the app yet; these use the same techniques.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Arroz rojo (Mexican red rice)](../#/recipe/arroz-rojo) | $0.95 | 268 | 5 g | 2 g | 550 mg |\n| [Mojito](../#/recipe/mojito) | $3.02 | 213 | 0 g | 0 g | 20 mg |", {"type": "hub", "center": "The Caribbean", "spokes": ["Jamaica + islands", "Cuba, PR, DR, Haiti"]}], ["k-jamaica-and-the-english-speaking-islands", "Jamaica and the English-speaking islands", "**Flavour base**: Scallion, thyme, scotch bonnet, allspice (pimento), garlic.\n\n**Pantry**: allspice, scotch bonnets, thyme, coconut milk, kidney beans, curry powder, plantains, canned ackee, salt fish.\n## Techniques\n- Jerk marinades and smoky grilling\n- Rice and peas cooked in coconut milk\n- Browning sugar for stews (brown stew)\n## Dishes to master, easiest first\n1. **Fried plantain**\n2. **Rice and peas**\n3. **Brown stew chicken**\n4. **Jerk chicken**\n5. **Curry goat**\n6. **Ackee and saltfish**\n7. **Trinidad doubles and roti**\n> ⚠️ Ackee: only canned or properly opened ripe fruit; unripe ackee is poisonous. Rice and peas often use kidney beans: canned are safe; dried must be boiled hard first.", {"type": "flow", "steps": ["Fried plantain", "Rice and peas", "Brown stew chicken", "Jerk chicken", "Curry goat", "Ackee and saltfish", "Trinidad doubles and"]}], ["k-cuba-puerto-rico-dominican-republic-and-haiti", "Cuba, Puerto Rico, Dominican Republic and Haiti", "**Flavour base**: Sofrito/recaito (onion, pepper, garlic, culantro); mojo (citrus and garlic); epis (Haiti).\n\n**Pantry**: sour orange, culantro, sazón and adobo seasonings, black beans and pigeon peas, plantains, yuca.\n## Techniques\n- Slow-roasting pork shoulder\n- Mashing fried plantain (mofongo)\n- Twice-fried plantain (tostones)\n## Dishes to master, easiest first\n1. **Tostones**\n2. **Black beans and rice** (moros y cristianos)\n3. **Ropa vieja**\n4. **Pernil**\n5. **Mofongo**\n6. **Griot with pikliz**", {"type": "flow", "steps": ["Tostones", "Black beans and rice", "Ropa vieja", "Pernil", "Mofongo", "Griot with pikliz"]}]]}, {"t": "South America", "s": [["south-america", "South America: overview", "South America ranges from Peru, one of the world’s great food cultures (Indigenous, Spanish, Chinese and Japanese influences), to the grill cultures of Brazil and Argentina, and the corn and plantain kitchens of the north.\n| Kitchen | Flavour base |\n| **Peru** | Ají amarillo, red onion, garlic, lime. |\n| **Brazil** | Garlic, onion and salt (alho e sal); coconut, dendê oil and chili in Bahia. |\n| **Argentina, Uruguay and Chile** | Garlic, parsley, oregano, chili, olive oil (chimichurri). |\n| **Colombia, Venezuela and Ecuador** | Hogao (tomato, scallion, onion); sofrito. |\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Picanha (churrasco steak)](../#/recipe/picanha) | $8.51 | 680 | 51 g | 0 g | 958 mg |\n| [Vinagrete (Brazilian salsa)](../#/recipe/vinagrete) | $0.86 | 136 | 1 g | 2 g | 185 mg |\n| [Farofa](../#/recipe/farofa) | $0.52 | 190 | 1 g | 3 g | 135 mg |", {"type": "hub", "center": "South America", "spokes": ["Peru", "Brazil", "Argentina + Chile", "Colombia + Venezuela"]}], ["k-peru", "Peru", "**Flavour base**: Ají amarillo, red onion, garlic, lime.\n\n**Pantry**: ají amarillo and ají panca pastes, limes, red onion, potatoes (many kinds), quinoa, corn, soy sauce (chifa), huacatay.\n## Techniques\n- Ceviche (raw fish “cooked” briefly in lime)\n- Lomo saltado (wok stir-fry, Chinese-Peruvian)\n- Potato terrines (causa)\n## Dishes to master, easiest first\n1. **Papa a la huancaína**\n2. **Causa**\n3. **Lomo saltado**\n4. **Ají de gallina**\n5. **Ceviche**\n6. **Anticuchos**\n7. **Pollo a la brasa**\n> ⚠️ Ceviche: lime acid does not kill bacteria or parasites. Use very fresh fish sold for raw eating (or previously frozen) and serve immediately.", {"type": "flow", "steps": ["Papa a la huancaína", "Causa", "Lomo saltado", "Ají de gallina", "Ceviche", "Anticuchos", "Pollo a la brasa"]}], ["k-brazil", "Brazil", "**Flavour base**: Garlic, onion and salt (alho e sal); coconut, dendê oil and chili in Bahia.\n\n**Pantry**: coarse salt, cassava flour, black beans, rice, dendê (palm) oil, coconut milk, limes, cachaça.\n## Techniques\n- Churrasco: big cuts, coarse salt, fire\n- Toasting cassava flour (farofa)\n- Fine dice and quick-pickle salsa (vinagrete)\n- Slow bean stews\n## Dishes to master, easiest first\n1. **Vinagrete**, farofa\n2. **Arroz e feijão**\n3. **Picanha**\n4. **Pão de queijo**\n5. **Moqueca** (fish stew)\n6. **Feijoada**\n7. **Brigadeiros**", {"type": "flow", "steps": ["Vinagrete", "Arroz e feijão", "Picanha", "Pão de queijo", "Moqueca", "Feijoada", "Brigadeiros"]}], ["k-argentina-uruguay-and-chile", "Argentina, Uruguay and Chile", "**Flavour base**: Garlic, parsley, oregano, chili, olive oil (chimichurri).\n\n**Pantry**: coarse salt, chimichurri herbs, dulce de leche, merkén (Chile), empanada dough.\n## Techniques\n- Asado (slow wood or charcoal grill)\n- Empanadas\n- Milanesa\n## Dishes to master, easiest first\n1. **Chimichurri**\n2. **Empanadas**\n3. **Milanesa**\n4. **Asado**\n5. **Pastel de choclo** (Chile)\n6. **Alfajores**", {"type": "flow", "steps": ["Chimichurri", "Empanadas", "Milanesa", "Asado", "Pastel de choclo", "Alfajores"]}], ["k-colombia-venezuela-and-ecuador", "Colombia, Venezuela and Ecuador", "**Flavour base**: Hogao (tomato, scallion, onion); sofrito.\n\n**Pantry**: precooked corn flour (masarepa), plantains, beans, guascas herb, avocado.\n## Techniques\n- Arepas (corn cakes, griddled)\n- Patacones (twice-fried plantain)\n- Slow soups\n## Dishes to master, easiest first\n1. **Arepas**\n2. **Patacones**\n3. **Ajiaco**\n4. **Bandeja paisa**\n5. **Pabellón criollo**", {"type": "flow", "steps": ["Arepas", "Patacones", "Ajiaco", "Bandeja paisa", "Pabellón criollo"]}]]}, {"t": "The United States and Canada", "s": [["north-america", "The United States and Canada: overview", "North American food is regional and immigrant-built: Southern and soul food from African-American cooks, Cajun and Creole in Louisiana, Tex-Mex and New Mexican, barbecue traditions, New England seafood, Indigenous foods (corn, beans, squash, wild rice, salmon, maple), and French-Canadian comfort food.\n| Kitchen | Flavour base |\n| **The American South, Cajun and Creole** | The holy trinity: onion, celery and green bell pepper; plus garlic. |\n| **Barbecue country** | Dry rubs (paprika, brown sugar, salt, pepper, garlic) and wood smoke. |\n| **Diner and everyday American** | Butter, onion, salt and pepper. |\n| **Canada and Indigenous foods** | Butter, onion, maple, wild herbs. |\n## Cook these in the app\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Buttermilk pancakes](../#/recipe/pancakes) | $2.01 | 549 | 13 g | 3 g | 784 mg |\n| [Smash burgers](../#/recipe/smash-burgers) | $2.77 | 628 | 28 g | 2 g | 1,015 mg |\n| [Stovetop mac and cheese](../#/recipe/mac-cheese) | $2.44 | 664 | 31 g | 2 g | 908 mg |\n| [New England clam chowder](../#/recipe/clam-chowder) | $4.29 | 527 | 28 g | 4 g | 854 mg |\n| [Corn chowder](../#/recipe/corn-chowder) | $2.05 | 308 | 9 g | 5 g | 662 mg |\n| [Cobb salad](../#/recipe/cobb-salad) | $5.24 | 631 | 43 g | 7 g | 911 mg |\n| [Chocolate chip cookies](../#/recipe/cookies) | $0.50 | 229 | 2 g | 1 g | 162 mg |\n| [The Caesar](../#/recipe/caesar) | $2.36 | 110 | 1 g | 1 g | 548 mg |", {"type": "hub", "center": "The United States and Canada", "spokes": ["The South + Cajun", "Barbecue country", "Diner classics", "Canada + Indigenous"]}], ["k-the-american-south-cajun-and-creole", "The American South, Cajun and Creole", "**Flavour base**: The holy trinity: onion, celery and green bell pepper; plus garlic.\n\n**Pantry**: cornmeal, buttermilk, Cajun/Creole seasoning, hot sauce, andouille, okra, collard greens, black-eyed peas, pecans.\n## Techniques\n- Dark roux (cooked to chocolate brown, stirring constantly)\n- Buttermilk soaking and frying\n- Low-and-slow greens\n- Biscuits (cold fat, minimal handling)\n## Dishes to master, easiest first\n1. **Cornbread**, biscuits\n2. **Collard greens**, black-eyed peas\n3. **Shrimp and grits**\n4. **Red beans and rice**\n5. **Gumbo**, jambalaya\n6. **Fried chicken**\n7. **Pecan pie**, peach cobbler\n> ⚠️ Hot roux sticks and burns like napalm; long sleeves, a long spoon, and never leave it.", {"type": "flow", "steps": ["Cornbread", "Collard greens", "Shrimp and grits", "Red beans and rice", "Gumbo", "Fried chicken", "Pecan pie"]}], ["k-barbecue-country", "Barbecue country", "**Flavour base**: Dry rubs (paprika, brown sugar, salt, pepper, garlic) and wood smoke.\n\n**Pantry**: smoked paprika, brown sugar, apple cider vinegar, mustard, wood chips.\n## Techniques\n- Low-and-slow smoking at 225–275°F\n- The stall (internal temperature plateaus around 150–170°F\n- Be patient or wrap)\n- Resting big cuts for an hour\n## Dishes to master, easiest first\n1. **Coleslaw**, baked beans\n2. **Pulled pork** (Carolina)\n3. **Ribs** (Memphis, Kansas City)\n4. **Brisket** (Texas)", {"type": "flow", "steps": ["Coleslaw", "Pulled pork", "Ribs", "Brisket"]}], ["k-diner-and-everyday-american", "Diner and everyday American", "**Flavour base**: Butter, onion, salt and pepper.\n\n**Pantry**: all-purpose flour, cheddar, ketchup and mustard, maple syrup, buttermilk.\n## Techniques\n- Smashing burgers for maximum browning\n- Roux and béchamel cheese sauces\n- Pancake batters (do not overmix)\n- Creaming butter and sugar for cookies\n## Dishes to master, easiest first\n1. **Pancakes**\n2. **Smash burgers**\n3. **Mac and cheese**\n4. **Clam chowder**\n5. **Cobb salad**\n6. **Chocolate chip cookies**, apple pie", {"type": "flow", "steps": ["Pancakes", "Smash burgers", "Mac and cheese", "Clam chowder", "Cobb salad", "Chocolate chip cookies"]}], ["k-canada-and-indigenous-foods", "Canada and Indigenous foods", "**Flavour base**: Butter, onion, maple, wild herbs.\n\n**Pantry**: maple syrup, wild rice, cheese curds, salmon, bannock ingredients, peameal bacon.\n## Techniques\n- Tourtière pastry\n- Smoking and planking fish\n- Bannock (quick pan bread)\n## Dishes to master, easiest first\n1. **Bannock**\n2. **Pea soup**\n3. **Poutine**\n4. **Cedar-plank salmon**\n5. **Tourtière**\n6. **Butter tarts**, maple taffy on snow\n> ⚠️ Fiddleheads must be cooked: boil 15 minutes or steam 10–12, and discard the water.", {"type": "flow", "steps": ["Bannock", "Pea soup", "Poutine", "Cedar-plank salmon", "Tourtière", "Butter tarts"]}]]}, {"t": "Australia, New Zealand and the Pacific", "s": [["oceania", "Australia, New Zealand and the Pacific: overview", "Pacific Island cooking is built on root crops (taro, yam, breadfruit, sweet potato), coconut and fish, often cooked in an earth oven (umu, lovo, hāngī). Australia and New Zealand blend British roots, Indigenous ingredients and Asian and Mediterranean influences.\n| Kitchen | Flavour base |\n| **The Pacific Islands and Hawaiʻi** | Coconut cream, lime, onion, chili; shoyu and sesame in Hawaiʻi. |\n| **Australia and New Zealand** | Modern and multicultural: olive oil, lemon, herbs, chili, soy. |\n## Practise the techniques in the app\nNo dishes from here in the app yet; these use the same techniques.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Lemon garlic salmon with asparagus](../#/recipe/salmon-asparagus) | $7.89 | 530 | 39 g | 5 g | 375 mg |\n| [Salmon onigiri](../#/recipe/onigiri) | $2.19 | 474 | 19 g | 2 g | 328 mg |", {"type": "hub", "center": "Australia, New Zealand and the Pacific", "spokes": ["Pacific + Hawaiʻi", "Australia + NZ"]}], ["k-the-pacific-islands-and-hawaii", "The Pacific Islands and Hawaiʻi", "**Flavour base**: Coconut cream, lime, onion, chili; shoyu and sesame in Hawaiʻi.\n\n**Pantry**: coconut cream, taro, breadfruit, sweet potato, very fresh fish, limes, shoyu, sesame, seaweed.\n## Techniques\n- Earth-oven cooking wrapped in leaves\n- Raw fish marinated in citrus and coconut\n- Poke (cubed raw fish dressed with shoyu and sesame)\n## Dishes to master, easiest first\n1. **Kokoda / ota ika** (citrus-coconut fish)\n2. **Poke bowls**\n3. **Palusami** (taro leaves in coconut cream)\n4. **Lovo / umu / hāngī**\n5. **Kalua pork**\n> ⚠️ Taro and taro leaves must be well cooked; raw they irritate the mouth and throat. Raw fish dishes: same rule as sushi and ceviche, use fish sold for raw eating.", {"type": "flow", "steps": ["Kokoda / ota ika", "Poke bowls", "Palusami", "Lovo / umu / hāngī", "Kalua pork"]}], ["k-australia-and-new-zealand", "Australia and New Zealand", "**Flavour base**: Modern and multicultural: olive oil, lemon, herbs, chili, soy.\n\n**Pantry**: lamb, seafood, macadamias, lemon myrtle and wattleseed (native), kūmara (sweet potato).\n## Techniques\n- The barbecue\n- Meat pies\n- Meringue\n## Dishes to master, easiest first\n1. **Smashed avocado toast**\n2. **Barbecued prawns and lamb**\n3. **Meat pie**\n4. **Roast lamb with kūmara**\n5. **Pavlova**, Anzac biscuits, lamingtons", {"type": "flow", "steps": ["Smashed avocado toast", "Barbecued prawns and", "Meat pie", "Roast lamb with kūmara", "Pavlova"]}]]}, {"t": "Through the day and ways of eating", "s": [["day-meals", "Breakfast, salads and desserts", "Some skills cut across every cuisine. The app has a lesson branch for each.\n- **Breakfast**: every culture has one: congee, idli, shakshuka, gallo pinto, miso soup and rice. For daily health, oats, eggs, yogurt and fruit are hard to beat.\n- **Salads**: a real salad has a base, a protein, crunch, acid and something rich. Salt the leaves; dress just before serving.\n- **Desserts**: baking rewards weighing and patience.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Shakshuka](../#/recipe/shakshuka) | $4.11 | 604 | 28 g | 10 g | 1,421 mg |\n| [French toast](../#/recipe/french-toast) | $3.80 | 651 | 22 g | 4 g | 732 mg |\n| [Caesar salad with homemade croutons](../#/recipe/caesar-salad) | $1.95 | 390 | 8 g | 4 g | 457 mg |\n| [Cobb salad](../#/recipe/cobb-salad) | $5.24 | 631 | 43 g | 7 g | 911 mg |\n| [Banana bread](../#/recipe/banana-bread) | $0.42 | 226 | 3 g | 1 g | 209 mg |\n| [Vanilla panna cotta](../#/recipe/panna-cotta) | $1.66 | 377 | 5 g | 1 g | 47 mg |", {"type": "split3", "cols": [["Breakfast", "Oats", "Eggs", "Shakshuka"], ["Salads", "Caesar", "Cobb", "Chickpea"], ["Desserts", "Cookies", "Crisp", "Panna cotta"]]}], ["day-drinks", "Drinks: smoothies, café and cocktails", "Each drink has a technique: blender order, extraction, steeping, shaking and stirring. Every cocktail in the app has a mocktail version.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Masala chai](../#/recipe/chai) | $0.54 | 85 | 4 g | 0 g | 56 mg |\n| [Cold brew coffee](../#/recipe/cold-brew) | $0.61 | 10 | 1 g | 0 g | 9 mg |\n| [Real hot chocolate](../#/recipe/hot-chocolate) | $1.90 | 355 | 11 g | 5 g | 149 mg |\n| [Fresh lemonade](../#/recipe/lemonade) | $0.87 | 109 | 0 g | 0 g | 1 mg |\n| [Classic margarita](../#/recipe/margarita) | $3.99 | 219 | 0 g | 0 g | 108 mg |\n| [Old fashioned](../#/recipe/old-fashioned) | $3.51 | 228 | 1 g | 3 g | 0 mg |\n> ⚠️ Alcohol doesn't fully cook off in sauces. The app flags it for no-alcohol, halal and pregnancy profiles.", {"type": "flow", "steps": ["Smoothie|blend", "Cold brew|steep cold", "Chai|simmer", "Margarita|shake", "Old fashioned|stir"]}], ["day-plants", "Plant-based and seafood", "**Plant-based** cooking is the world's oldest cuisine: dal, falafel, gallo pinto, misir wot, ratatouille. Combine legumes and grains, season tofu boldly, and get B12 from fortified foods or a supplement.\n**Seafood** cooks fast and gently: dry it, cook skin-side down, pull it when it just flakes. Aim for fatty fish (salmon, sardines, mackerel, trout) about twice a week for omega-3s.\n| Dish | Cost | kcal | Protein | Fibre | Sodium |\n| [Tofu scramble](../#/recipe/tofu-scramble) | $3.16 | 386 | 25 g | 5 g | 558 mg |\n| [Black bean burgers](../#/recipe/bean-burgers) | $2.02 | 501 | 18 g | 14 g | 708 mg |\n| [Buddha bowl with tahini dressing](../#/recipe/buddha-bowl) | $3.35 | 754 | 23 g | 19 g | 490 mg |\n| [Baja-style fish tacos](../#/recipe/fish-tacos) | $6.24 | 507 | 38 g | 8 g | 420 mg |\n| [Shrimp scampi linguine](../#/recipe/shrimp-scampi) | $6.43 | 709 | 43 g | 3 g | 984 mg |\n| [Moules marinières](../#/recipe/moules) | $8.33 | 848 | 43 g | 4 g | 1,489 mg |", {"type": "split", "lt": "Plant-based", "rt": "Seafood", "left": ["Legumes + grains", "Bold tofu", "B12 source", "Nuts + seeds"], "right": ["Pat dry", "Skin side down", "Pull when flaky", "Fatty fish 2×/wk"]}]]}, {"t": "Becoming a Masterchef", "s": [["palate", "Training your palate", "Great cooks are great tasters, and a **palate** is trained, not born.\n1. Taste every component on its own before combining: the sauce, the rice, the vegetable.\n2. Taste side by side: two olive oils, three vinegars, cheap and good soy sauce.\n3. Season a cup of plain broth one lever at a time (salt, then acid, then sweet, then fat) and notice each change.\n4. When you eat out, name what you taste: what's the acid? the fat? the crunch?\n5. Recreate a restaurant dish at home from memory, then compare notes.\n- Keep a flavour journal (the cook log works) of pairings that surprised you.", {"type": "loop", "steps": ["Taste", "Name it", "Adjust one lever", "Taste again", "Write it down"]}], ["menus", "Menus, timing and mise en place", "## Build a balanced menu\n- Vary **methods**: a braised main wants a crisp, fresh side.\n- Vary **richness**: a rich main wants a light starter and a bright dessert.\n- Vary colour and texture: something crunchy, something soft, something green.\n- At most **one** dish that needs last-minute attention.\n- Cover every guest's diet with a full meal, not just sides.\n## Work backwards\nWrite the serving time at the bottom of a page and plan upwards: what rests, what holds warm, what can be made the day before (braises, desserts, dressings, dough).\n> **Mise en place**: everything chopped, measured and in bowls before the first pan is hot.", {"type": "timeline", "items": [["Day before", "dessert, braise"], ["−3 h", "mise en place"], ["−1 h", "main in oven"], ["−20 min", "starter out"], ["0", "serve"], ["+40", "dessert"]]}], ["plating", "Plating", "- **Warm plates** for hot food, cold plates for cold.\n- Odd numbers, **height**, and empty space.\n- Sauce **under** crisp things, never over them.\n- One garnish that you can eat and that belongs in the dish.\n- Wipe the rim.\n- Serve the hot thing **last** and fast.", {"type": "hub", "center": "The plate", "spokes": ["Warm plate", "Height", "Sauce under", "Odd numbers", "Edible garnish", "Clean rim"]}], ["pressure", "Pressure tests and the mystery box", "Competition cooking tests three things: technique under pressure, using what's in front of you, and having your own point of view.\n| Drill | How |\n| **Mystery box** | Five random ingredients from your kitchen, a dish in 45 minutes. First ask: which mother technique fits? |\n| **Pressure test** | A technical dish exactly to spec, against a clock: risotto in 25 minutes, a béchamel, an omelette, a pie crust |\n| **Invention test** | Move a dish to another cuisine: bulgogi tacos, miso risotto, curry-spiced shakshuka. Keep the technique, change the flavour base. |\n| **Service** | The same dish for eight people. Scale it and shop with the app's grocery list. |\n| **Recreate** | Taste a dish once, cook it from memory. |", {"type": "split3", "cols": [["Mystery box", "5 ingredients", "45 minutes", "Pick a technique"], ["Pressure test", "One spec", "A clock", "Exact result"], ["Invention", "Keep technique", "Swap base", "New dish"]]}], ["invent", "Inventing your own dishes", "1. Start from a **technique** you trust.\n2. Choose a **flavour base** from the atlas.\n3. Add **contrast**: acid, crunch, freshness, heat.\n4. Cook it three times, changing one thing each time, and note the results.\n5. Write it up like the app's recipes: what it teaches, steps, fixes, variations.", {"type": "flow", "steps": ["Technique", "Flavour base", "Contrast", "Cook ×3", "Write it up"]}], ["final", "The Masterchef checklist", "Tick these off as you go. They're saved in your browser.\n- All six path dishes cooked twice.\n- Every Foundations lesson complete.\n- At least one dish from every region of the atlas.\n- Five sauces or emulsions from memory.\n- A yeast bread, a pastry and a custard.\n- A three-course dinner party, hosted.\n- Three original recipes that friends asked for.", {"type": "checklist", "key": "final", "items": ["All six path dishes, twice", "Foundations lessons complete", "One dish from every atlas region", "Five sauces from memory", "A yeast bread", "A pastry", "A custard", "A three-course dinner party", "Three original recipes friends asked for"]}]]}, {"t": "Sources and further reading", "s": [["biblio", "Bibliography", "Sources cited in this book, numbered in order of first citation. Guidance changes; check the official page before relying on a number. This book is general cooking and nutrition information, not medical advice.", null], ["reading", "Further reading", "- **Harold McGee**, *On Food and Cooking*: the science of everything in the kitchen.\n- **Samin Nosrat**, *Salt, Fat, Acid, Heat*: the flavour levers, beautifully explained.\n- **J. Kenji López-Alt**, *The Food Lab* and *The Wok*: technique, tested.\n- **Nik Sharma**, *The Flavor Equation*: how taste works.\n- **Mark Bittman**, *How to Cook Everything*: the reference for every staple.\n- **Marcella Hazan**, *Essentials of Classic Italian Cooking*.\n- **Madhur Jaffrey**, *Indian Cookery* and *World Vegetarian*.\n- **Fuchsia Dunlop**, *Every Grain of Rice* (Chinese home cooking).\n- **Diana Kennedy**, *The Essential Cuisines of Mexico*.\n- **Andrea Nguyen**, *Into the Vietnamese Kitchen*.\n- **Yotam Ottolenghi and Sami Tamimi**, *Jerusalem*.\n- **Health Canada** food safety pages and **Canada's food guide**; **USDA FSIS** food safety basics.", null]]}];
const D={"plate": "The plate is about proportions over a day, not perfection at every meal. A breakfast of oats and berries, a lunch of chickpea salad and a dinner of dal with rice and a side of greens adds up to a plate-shaped day even though no single meal looks like the picture.\n\nIf you're trying to lose fat, the plate still works: keep the half of vegetables, keep the protein, and shrink the grain quarter. If you're building muscle, grow the protein and grain quarters and keep the vegetables.", "temps": "Why do the two agencies differ? Safety is about time as well as temperature: bacteria die faster the hotter it is, so 63°C held for a few minutes can be as safe as a higher temperature reached for an instant. The USDA builds that into its 3-minute rest for whole cuts. Health Canada publishes simpler single numbers with more margin, for example 71°C for pork and 82°C for whole birds.\n\nFor everyday cooking, either set is a sound target for healthy adults. The higher Canadian numbers are the cautious choice for anyone at higher risk.", "maillard": "Browning is the reason a seared steak tastes nothing like a boiled one, and why roasted vegetables beat steamed ones for flavour. Because water can't get hotter than 100°C at normal pressure, wet surfaces stall below browning temperatures. That's why recipes keep telling you to pat things dry, use a hot pan and leave space between pieces.", "levers": "Professional cooks taste constantly and make small adjustments. A useful habit: before you add more of anything, ask which lever is missing. Ninety percent of the time the answer is salt or acid, and a pinch of salt plus a squeeze of lemon turns 'fine' into 'good'.", "emulsions": "Fat and water don't mix on their own. An emulsifier has one end that likes water and one that likes fat, so it coats tiny droplets and keeps them apart: lecithin in egg yolk, compounds in mustard, and the starch in pasta water all work this way. Adding fat slowly gives the emulsifier time to coat each new droplet; dumping it in at once overwhelms it, and the sauce 'breaks' into greasy puddles.", "danger": "Cooling is where home cooks most often go wrong. A big pot of chili can sit in the danger zone for many hours if you put it straight into the fridge, because the middle cools so slowly. Divide it into shallow containers (5 cm deep or less) and leave the lids off until it stops steaming."};

{const SS=window.speechSynthesis,bar=document.getElementById('tts');

 try{SS.cancel()}catch(e){}
 const SKIP='.viz,button,.acts,.toc,.meta,.hint,pre,code,svg,[hidden],[aria-hidden="true"]',SEL='h1,h2,h3,p,li,tr';
 const clean=s=>s.replace(/\s+/g,' ').replace(/\s+([,.;:!?])/g,'$1').trim();
 const strip=el=>{const c=el.cloneNode(true);c.querySelectorAll('.cite,.cites,button,svg,.bmk,sup,pre,code').forEach(x=>x.remove());return clean(c.textContent)};
 const text=el=>{if(el.tagName!='TR')return strip(el);if(el.closest('thead'))return '';const t=el.closest('table'),hs=t?[...t.querySelectorAll('thead th')].map(strip):[];
  const cs=[...el.children].map(strip);const first=cs.shift()||'';const rest=cs.map((c,k)=>c&&(hs[k+1]?hs[k+1]+' '+c:c)).filter(Boolean);return first+(rest.length?': '+rest.join('; '):'')+'.'};
 const items=[];
 secs.forEach((s,si)=>s.querySelectorAll(SEL).forEach(el=>{if(el.closest(SKIP)||el.style.display=='none')return;for(let a=el.parentElement;a&&a!==s;a=a.parentElement)if(a.matches(SEL))return;
  const t=clean(text(el));if(!/[A-Za-z0-9]/.test(t))return;el.classList.add('tts-r');el.dataset.tts=items.length;items.push({el,si,text:t})}));
 const MAX=180;
 const chunk=t=>{const out=[];let buf='';for(let s of t.split(/(?<=[.!?…:;])\s+/)){s=s.trim();if(!s)continue;
   while(s.length>MAX){let k=s.lastIndexOf(', ',MAX);if(k<60)k=s.lastIndexOf(' ',MAX);if(k<30)k=MAX;out.push(s.slice(0,k+1).trim());s=s.slice(k+1).trim()}
   if(buf&&(buf+' '+s).length>MAX){out.push(buf);buf=s}else buf=buf?buf+' '+s:s}
  if(buf)out.push(buf);return out};
 const $p=document.getElementById('ttsplay'),$st=document.getElementById('ttsst'),$rate=document.getElementById('ttsrate'),$voice=document.getElementById('ttsvoice');
 const store=(k,v)=>{try{localStorage.setItem('tts-'+k,v)}catch(e){}};
 const load=k=>{try{return localStorage.getItem('tts-'+k)}catch(e){return null}};
 let st='idle',idx=0,ci=0,chunks=[],tok=0,rate=+(load('rate')||1),voice=null,started=0,lastEl=null;
 if([...$rate.options].some(o=>+o.value==rate))$rate.value=String(rate);else rate=1;
 function fillVoices(){const vs=SS.getVoices();if(!vs.length)return;const lang=(document.documentElement.lang||'en').toLowerCase().slice(0,2),want=load('voice');
  const sorted=[...vs].sort((a,b)=>(b.lang.toLowerCase().startsWith(lang)-a.lang.toLowerCase().startsWith(lang))||(b.default-a.default)||a.name.localeCompare(b.name));
  $voice.innerHTML='<option value="">Default voice</option>'+sorted.map(v=>`<option value="${v.voiceURI.replace(/"/g,'&quot;')}">${v.name.replace(/</g,'&lt;')} (${v.lang})</option>`).join('');
  voice=sorted.find(v=>v.voiceURI==want)||null;$voice.value=voice?voice.voiceURI:''}
 fillVoices();if(SS.addEventListener)SS.addEventListener('voiceschanged',fillVoices);else SS.onvoiceschanged=fillVoices;
 function ui2(){const playing=st=='playing';$p.innerHTML=playing?'❚❚<span class="t"> Pause</span>':'▶<span class="t"> Play</span>';$p.setAttribute('aria-label',playing?'Pause':'Play');
  $st.textContent=st=='idle'?'Read aloud':`${playing?'Reading':'Paused'} · p.${items[idx]?items[idx].si+1:''}`}
 function view(el){const r=el.getBoundingClientRect();if(r.top<90||r.bottom>innerHeight-150)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'})}
 function mark(it){if(lastEl)lastEl.classList.remove('tts-cur');lastEl=it.el;it.el.classList.add('tts-cur');if(mode=='map')return;
  if(it.si!==cur){goTo(it.si);setTimeout(()=>view(it.el),mode=='book'?650:160)}else view(it.el)}
 function next(){if(st!='playing')return;
  while(idx<items.length&&!chunks.length){chunks=chunk(items[idx].text);ci=0;if(!chunks.length)idx++}
  if(idx>=items.length){stop();return}

  const u=new SpeechSynthesisUtterance(chunks[ci]);u.rate=rate;u.lang=voice?voice.lang:(document.documentElement.lang||'en');if(voice)u.voice=voice;
